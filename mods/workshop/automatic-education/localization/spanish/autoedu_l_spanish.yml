 autoedu_editor_preset_common_rules_1_4:0 "1. Incluye al [Concept( 'primary_heir', 'heredero principal' )|E], los [Concept( 'children', 'hijos' )|E] del gobernante, nietos y bisnietos.\n2. Asigna automáticamente [Concept( 'guardian', 'tutores' )|E] entre los @courtier_icon! [Concept( 'courtiers', 'cortesanos' )|E] del gobernante, sus @autoedu_close_family_icon! [Concept( 'close_family_members', 'familiares cercanos' )|E] y los miembros de su @autoedu_house_icon! [Concept( 'house', 'Casa' )|E].\n3. Solo selecciona tutores que compartan la @religious_icon! [Concept( 'faith', 'fe' )|E] y la @culture_icon! [Concept( 'culture', 'cultura' )|E] del gobernante. Se ignoran la edad, el sexo y la brujería.\n4. Cambia la @religious_icon! [Concept( 'faith', 'fe' )|E] y la @culture_icon! [Concept( 'culture', 'cultura' )|E] del niño por la fe y cultura del tutor."
 autoedu_editor_preset_common_rule_6:0 "6. No envía a los niños a la @building_icon! universidad ni al @child_exam_icon! [Concept( 'childrens_examination', 'Examen infantil' )|E]."

 autoedu_editor_preset_description_1:0 "Educa a tus descendientes en la fe y la cultura del gobernante usando el orden configurado de prioridades del enfoque de educación.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selecciona el @skill_learning_icon! [Concept( 'education_focus', 'enfoque de educación' )|E] según el orden de prioridades configurado.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_2:0 "Descendientes: Diplomacia"
 autoedu_editor_preset_description_2:0 "Educa a tus descendientes en la fe y la cultura del gobernante con énfasis en Diplomacia.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selecciona el @skill_learning_icon! [Concept( 'education_focus', 'enfoque de educación' )|E] por prioridad de izquierda a derecha: diplomacia, intriga, aprendizaje, administración, marcial.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_3:0 "Descendientes: Marcial"
 autoedu_editor_preset_description_3:0 "Educa a tus descendientes en la fe y la cultura del gobernante con énfasis en la habilidad Marcial.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selecciona el @skill_learning_icon! [Concept( 'education_focus', 'enfoque de educación' )|E] por prioridad de izquierda a derecha: marcial, administración, diplomacia, intriga, aprendizaje.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_4:0 "Descendientes: Administración"
 autoedu_editor_preset_description_4:0 "Educa a tus descendientes en la fe y la cultura del gobernante con énfasis en Administración.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selecciona el @skill_learning_icon! [Concept( 'education_focus', 'enfoque de educación' )|E] por prioridad de izquierda a derecha: administración, aprendizaje, diplomacia, marcial, intriga.\n$autoedu_editor_preset_common_rule_6$"
