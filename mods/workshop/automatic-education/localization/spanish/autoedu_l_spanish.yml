 autoedu.0120.t:0 "El tutor ha muerto"
 autoedu.0120.desc:0 "El tutor de [autoedu_child.GetShortUIName] ha muerto. Puede elegirse un nuevo mentor de inmediato para que la educación del niño no pierda rumbo."
 autoedu.0120.choose:0 "Elegir un nuevo [guardian|E]."
 autoedu.0120.wait_cleanup:0 "Esperar a que la [court|E] resuelva las formalidades."
 autoedu.0120.postpone:0 "Posponer la búsqueda."
 autoedu.0120.ignore:0 "No volver a intervenir en esta educación."
 autoedu.tt.guardian_dead_choose:0 "Si hace falta, primero se elegirá un [education_focus|E] y luego un [guardian|E] según los ajustes actuales."
 autoedu.tt.guardian_dead_wait_cleanup:0 "El niño aún parece tener un [guardian|E]. Esto puede ocurrir brevemente tras la muerte de un personaje; su educación se revisará de nuevo dentro de unos días."
 autoedu.tt.guardian_dead_postpone:0 "La búsqueda de un [guardian|E] para este niño se repetirá aproximadamente dentro de medio año."

 autoedu.1200.t:0 "Elegir un enfoque de educación"
 autoedu.1200.desc:0 "El rasgo infantil de [autoedu_child.GetShortUIName] ya es visible, y su educación todavía puede orientarse hacia un camino adecuado."
 autoedu.1200.diplomacy:0 "Elegir [diplomacy|E]"
 autoedu.1200.martial:0 "Elegir [martial|E]"
 autoedu.1200.stewardship:0 "Elegir [stewardship|E]"
 autoedu.1200.intrigue:0 "Elegir [intrigue|E]"
 autoedu.1200.learning:0 "Elegir [learning|E]"
 autoedu.1200.skip:0 "No cambiar el [education_focus|E]."
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E] encaja con [childhood_trait|E] como [GetTrait('charming').GetName( GetNullCharacter )] y [GetTrait('curious').GetName( GetNullCharacter )]. Esta dirección también ayudará al seleccionar un [guardian|E] adecuado."
 autoedu.tt.focus_martial:0 "[martial|E] encaja con [childhood_trait|E] como [GetTrait('bossy').GetName( GetNullCharacter )] y [GetTrait('rowdy').GetName( GetNullCharacter )]. Esta dirección también ayudará al seleccionar un [guardian|E] adecuado."
 autoedu.tt.focus_stewardship:0 "[stewardship|E] encaja con [childhood_trait|E] como [GetTrait('bossy').GetName( GetNullCharacter )] y [GetTrait('pensive').GetName( GetNullCharacter )]. Esta dirección también ayudará al seleccionar un [guardian|E] adecuado."
 autoedu.tt.focus_intrigue:0 "[intrigue|E] encaja con [childhood_trait|E] como [GetTrait('charming').GetName( GetNullCharacter )] y [GetTrait('rowdy').GetName( GetNullCharacter )]. Esta dirección también ayudará al seleccionar un [guardian|E] adecuado."
 autoedu.tt.focus_learning:0 "[learning|E] encaja con [childhood_trait|E] como [GetTrait('curious').GetName( GetNullCharacter )] y [GetTrait('pensive').GetName( GetNullCharacter )]. Esta dirección también ayudará al seleccionar un [guardian|E] adecuado."
 autoedu.tt.focus_skip:0 "No elegir un [education_focus|E] ahora. La selección de [guardian|E] puede continuar si está activada."

 autoedu.2000.t:0 "Educación en la universidad"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName] tiene ahora la oportunidad de continuar su educación en una universidad lejos de la corte conocida."
 autoedu.2000.a:0 "Pagar la matrícula y enviar al niño a la universidad."
 autoedu.2000.b:0 "Ahora no."
 autoedu.2000.c:0 "No volver a tratar este asunto."
 autoedu.tt.university_no_gold:0 "No tienes suficiente [gold|E] para pagar la universidad y mantener la reserva seleccionada."
 autoedu.4100.t:0 "El ejemplo del tutor"
 autoedu.4100.desc:0 "Con cada nueva lección, [autoedu_personality_child.GetShortUIName] presta más atención a mis palabras y sigue mi ejemplo. Quizá ahora pueda orientar el carácter de mi pupilo por un camino que conozco bien."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Dejarlo para más tarde"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "Una lección sobre el arte de la guerra"
 autoedu.4150.desc:0 "Los mapas y las enseñanzas no bastan. Ha llegado la hora de que [autoedu_martial_training_child.GetShortUIName] conozca lo que me enseñaron mis propias campañas y batallas. Quizá pueda transmitir a mi pupilo uno de mis rasgos de comandante."
 autoedu.4200.t:0 "Listo para el examen infantil"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] está listo para presentarse al Examen infantil. Tener éxito en él podría darle un buen comienzo en la vida adulta, pero organizar el intento requerirá tu influencia."
 autoedu.4200.send:0 "Enviar al examen infantil"
 autoedu.4200.later:0 "Ahora no."
 autoedu.tt.child_exam_send:0 "Gasta [influence|E] para enviar a [autoedu_child_exam_child.GetShortUIName] al [Concept( 'childrens_examination', 'Examen infantil' )|E]."

 autoedu.3900.t:0 "No hay niños elegibles"
 autoedu.3900.desc:0 "No se ha encontrado ningún niño elegible con las reglas de educación actuales."
 autoedu.3900.ok:0 "Entendido."

 autoedu.3901.t:0 "No se encontró un tutor adecuado"
 autoedu.3901.desc:0 "Se puede buscar tutor para [autoedu_child.GetShortUIName], pero nadie cumple los requisitos actuales. También se han revisado los demás niños elegibles."
 autoedu.3902.t:0 "Tutoría no disponible"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] está dentro de una política educativa activa, pero su corte actual no permite concertar una tutoría en este momento. También se han revisado los demás niños elegibles."
 autoedu.3903.t:0 "Búsqueda de tutor aplazada"
 autoedu.3903.desc:0 "La búsqueda de un nuevo tutor para [autoedu_child.GetShortUIName] está aplazada temporalmente. También se han revisado los demás niños elegibles."
 autoedu.3904.t:0 "Tutoría no disponible por ahora"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] está dentro de una política educativa activa, pero ahora mismo no se puede concertar una tutoría. También se han revisado los demás niños elegibles."

 autoedu_guardian_assigned_title:0 "Tutor nombrado"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] toma a [autoedu_child.GetShortUIName] bajo su tutela y guía su educación hacia [autoedu_child.GetFocus.GetName]."
 autoedu_no_guardian_found_title:0 "No se encontró tutor"
 autoedu_no_guardian_found_desc:0 "No se encontró un [guardian|E] adecuado para [autoedu_child.GetShortUIName] con las reglas actuales. Considera ampliar el grupo de candidatos o relajar las reglas de elección del tutor."
 autoedu_university_sent_title:0 "Educación universitaria"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] ha sido enviado a la universidad."




























