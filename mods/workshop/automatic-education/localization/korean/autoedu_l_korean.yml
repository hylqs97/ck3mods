 autoedu_editor_editor_preset_5:0 "후손: 계책"
 autoedu_editor_preset_description_5:0 "영주의 신앙과 문화에 맞춰 후손을 교육하며 계책을 중시합니다.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. @skill_learning_icon! [Concept( 'education_focus', '교육 초점' )|E]을 왼쪽부터 다음 우선순위로 선택합니다: 계책, 외교, 관리, 학습, 전투.\n$autoedu_editor_preset_common_rule_6$"
