 autoedu_editor_preset_common_rules_1_4:0 "1. [Concept( 'primary_heir', '최우선 후계자' )|E], 영주의 [Concept( 'children', '자녀' )|E], 손주와 증손주를 대상으로 합니다.\n2. 영주의 @courtier_icon! [Concept( 'courtiers', '궁정 신하' )|E], @autoedu_close_family_icon! [Concept( 'close_family_members', '식구 구성원' )|E], @autoedu_house_icon! [Concept( 'house', '집안' )|E] 구성원 중에서 [Concept( 'guardian', '후견인' )|E]을 자동으로 지정합니다.\n3. 영주와 같은 @religious_icon! [Concept( 'faith', '신앙' )|E]과 @culture_icon! [Concept( 'culture', '문화' )|E]를 가진 후견인만 선택합니다. 연령, 성별, 마녀 여부는 무시합니다.\n4. 아이의 @religious_icon! [Concept( 'faith', '신앙' )|E]과 @culture_icon! [Concept( 'culture', '문화' )|E]를 후견인의 신앙과 문화로 변경합니다."
 autoedu_editor_preset_common_rule_6:0 "6. 아이를 @building_icon! 대학이나 @child_exam_icon! [Concept( 'childrens_examination', '동자거' )|E]에 보내지 않습니다."

 autoedu_editor_preset_description_1:0 "영주의 신앙과 문화에 맞춰 후손을 교육하며 설정된 교육 초점 우선순위를 사용합니다.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. 설정된 우선순위에 따라 @skill_learning_icon! [Concept( 'education_focus', '교육 초점' )|E]을 선택합니다.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_2:0 "후손: 외교"
 autoedu_editor_preset_description_2:0 "영주의 신앙과 문화에 맞춰 후손을 교육하며 외교를 중시합니다.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. @skill_learning_icon! [Concept( 'education_focus', '교육 초점' )|E]을 왼쪽부터 다음 우선순위로 선택합니다: 외교, 계책, 학습, 관리, 전투.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_3:0 "후손: 전투"
