 autoedu.0120.t:0 "후견인이 사망함"
 autoedu.0120.desc:0 "[autoedu_child.GetShortUIName]의 후견인이 사망했습니다. 아이의 교육이 방향을 잃지 않도록 즉시 새 스승을 선택할 수 있습니다."
 autoedu.0120.choose:0 "새 [guardian|E]을 선택합니다."
 autoedu.0120.wait_cleanup:0 "[court|E]에서 절차를 정리할 때까지 기다립니다."
 autoedu.0120.postpone:0 "탐색을 미룹니다."
 autoedu.0120.ignore:0 "이 교육에는 다시 개입하지 않습니다."
 autoedu.tt.guardian_dead_choose:0 "필요하다면 먼저 [education_focus|E]가 선택되고, 이후 현재 설정에 따라 [guardian|E]이 선택됩니다."
 autoedu.tt.guardian_dead_wait_cleanup:0 "아이에게 아직 [guardian|E]이 있는 것처럼 보입니다. 인물 사망 직후 잠시 이런 일이 생길 수 있습니다. 며칠 뒤 이 아이의 교육을 다시 확인합니다."
 autoedu.tt.guardian_dead_postpone:0 "이 아이의 [guardian|E] 찾기는 약 반년 후 다시 진행됩니다."

 autoedu.1200.t:0 "교육 초점 선택"
 autoedu.1200.desc:0 "[autoedu_child.GetShortUIName]의 아동 특성은 이미 보이며, 교육은 아직 어울리는 방향으로 이끌 수 있습니다."
 autoedu.1200.diplomacy:0 "[diplomacy|E] 선택"
 autoedu.1200.martial:0 "[martial|E] 선택"
 autoedu.1200.stewardship:0 "[stewardship|E] 선택"
 autoedu.1200.intrigue:0 "[intrigue|E] 선택"
 autoedu.1200.learning:0 "[learning|E] 선택"
 autoedu.1200.skip:0 "[education_focus|E]를 변경하지 않습니다."
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E]는 [GetTrait('charming').GetName( GetNullCharacter )] 및 [GetTrait('curious').GetName( GetNullCharacter )] 같은 [childhood_trait|E]에 어울립니다. 이 방향은 적합한 [guardian|E]을 선택할 때도 도움이 됩니다."
 autoedu.tt.focus_martial:0 "[martial|E]는 [GetTrait('bossy').GetName( GetNullCharacter )] 및 [GetTrait('rowdy').GetName( GetNullCharacter )] 같은 [childhood_trait|E]에 어울립니다. 이 방향은 적합한 [guardian|E]을 선택할 때도 도움이 됩니다."
 autoedu.tt.focus_stewardship:0 "[stewardship|E]는 [GetTrait('bossy').GetName( GetNullCharacter )] 및 [GetTrait('pensive').GetName( GetNullCharacter )] 같은 [childhood_trait|E]에 어울립니다. 이 방향은 적합한 [guardian|E]을 선택할 때도 도움이 됩니다."
 autoedu.tt.focus_intrigue:0 "[intrigue|E]는 [GetTrait('charming').GetName( GetNullCharacter )] 및 [GetTrait('rowdy').GetName( GetNullCharacter )] 같은 [childhood_trait|E]에 어울립니다. 이 방향은 적합한 [guardian|E]을 선택할 때도 도움이 됩니다."
 autoedu.tt.focus_learning:0 "[learning|E]는 [GetTrait('curious').GetName( GetNullCharacter )] 및 [GetTrait('pensive').GetName( GetNullCharacter )] 같은 [childhood_trait|E]에 어울립니다. 이 방향은 적합한 [guardian|E]을 선택할 때도 도움이 됩니다."
 autoedu.tt.focus_skip:0 "지금은 [education_focus|E]를 선택하지 않습니다. [guardian|E] 선택이 활성화되어 있으면 계속될 수 있습니다."

 autoedu.2000.t:0 "대학 교육"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName](은)는 익숙한 궁정을 떠나 대학에서 교육을 이어갈 기회를 얻었습니다."
 autoedu.2000.a:0 "학비를 내고 아이를 대학에 보냅니다."
 autoedu.2000.b:0 "지금은 아닙니다."
 autoedu.2000.c:0 "이 문제로 다시 돌아오지 않습니다."
 autoedu.tt.university_no_gold:0 "대학 비용을 내고 선택한 예비금을 유지하기에 [gold|E]가 부족합니다."
 autoedu.4100.t:0 "후견인의 본보기"
 autoedu.4100.desc:0 "새로운 가르침을 거듭할수록 [autoedu_personality_child.GetShortUIName](은)는 내 말에 더욱 귀를 기울이고 나를 본보기로 삼는다. 지금이라면 피후견인의 성격을 내가 잘 아는 방향으로 이끌 수 있을지도 모른다."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "나중으로 미루기"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "전쟁술 수업"
 autoedu.4150.desc:0 "지도와 가르침만으로는 부족하다. 이제 [autoedu_martial_training_child.GetShortUIName]에게 내가 직접 겪은 원정과 전투가 가르쳐 준 것을 보여 줄 때다. 어쩌면 내 지휘관 특성 중 하나를 피후견인에게 물려줄 수 있을지도 모른다."
 autoedu.4200.t:0 "동자거 준비 완료"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName](은)는 동자거를 치를 준비가 되었습니다. 시험에서 성공하면 성인이 된 뒤 좋은 출발을 할 수 있지만, 시험을 준비하려면 당신의 영향력이 필요합니다."
 autoedu.4200.send:0 "동자거로 보내기"
 autoedu.4200.later:0 "지금은 아니다."
 autoedu.tt.child_exam_send:0 "[influence|E]를 사용해 [autoedu_child_exam_child.GetShortUIName](을)를 [Concept( 'childrens_examination', '동자거' )|E]에 보냅니다."

 autoedu.3900.t:0 "대상 아이 없음"
 autoedu.3900.desc:0 "현재 교육 규칙에서는 대상 아이를 찾지 못했습니다."
 autoedu.3900.ok:0 "알겠습니다."

 autoedu.3901.t:0 "적합한 후견인을 찾지 못함"
 autoedu.3901.desc:0 "[autoedu_child.GetShortUIName]에게 후견인을 정할 수 있지만, 현재 조건에 맞는 적합한 인물을 찾지 못했습니다. 다른 대상 아이들도 함께 확인했습니다."
 autoedu.3902.t:0 "후견을 정할 수 없음"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName]은 활성화된 교육 정책의 대상이지만, 현재 머무는 궁정에서는 지금 후견 관계를 마련할 수 없습니다. 다른 대상 아이들도 함께 확인했습니다."
 autoedu.3903.t:0 "후견인 찾기 보류"
 autoedu.3903.desc:0 "[autoedu_child.GetShortUIName]의 새 후견인을 찾는 일은 잠시 보류되었습니다. 다른 대상 아이들도 함께 확인했습니다."
 autoedu.3904.t:0 "현재 후견을 정할 수 없음"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName]은 활성화된 교육 정책의 대상이지만, 현재는 후견 관계를 마련할 수 없습니다. 다른 대상 아이들도 함께 확인했습니다."

 autoedu_guardian_assigned_title:0 "후견인 임명"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName](이)가 [autoedu_child.GetShortUIName]을 지도하며 아이의 교육을 [autoedu_child.GetFocus.GetName] 방향으로 이끕니다."
 autoedu_no_guardian_found_title:0 "후견인을 찾지 못함"
 autoedu_no_guardian_found_desc:0 "현재 선택 조건으로는 [autoedu_child.GetShortUIName]에게 적합한 [guardian|E]을 찾지 못했습니다. 후보 범위를 넓히거나 후견인 조건을 완화해 보십시오."
 autoedu_university_sent_title:0 "대학 교육"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName](이)가 대학으로 보내졌습니다."




























