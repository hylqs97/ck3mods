 autoedu.1000.t:0 "후견인 선택"
 autoedu.1000.desc:0 "궁정에서는 [autoedu_child.GetShortUIName]의 장래가 점점 더 자주 화제가 되고 있다. 아이의 소질도 드러나기 시작했으니 이제 누구에게 양육과 교육을 맡길지 결정할 때다."
