 autoedu_editor_editor_preset_1:0 "Потомки"
 autoedu_editor_preset_common_rules_1_4:0 "1. Охватывает [Concept( 'primary_heir', 'первого наследника' )|E], [Concept( 'children', 'детей' )|E] правителя, внуков и правнуков.\n2. Автоматически назначает [Concept( 'guardian', 'опекунов' )|E] из числа @courtier_icon! [Concept( 'courtiers', 'придворных' )|E] правителя, @autoedu_close_family_icon! [Concept( 'close_family_members', 'близких родственников' )|E] и членов @autoedu_house_icon! [Concept( 'house', 'дома' )|E].\n3. Выбирает только опекунов той же @religious_icon! [Concept( 'faith', 'конфессии' )|E] и @culture_icon! [Concept( 'culture', 'культуры' )|E], что и правитель. Возраст, пол и ведовство не учитываются.\n4. Меняет @religious_icon! [Concept( 'faith', 'конфессию' )|E] и @culture_icon! [Concept( 'culture', 'культуру' )|E] ребенка на конфессию и культуру опекуна."
 autoedu_editor_preset_common_rule_6:0 "6. Не отправляет детей в @building_icon! университет или на @child_exam_icon! [Concept( 'childrens_examination', 'детский экзамен' )|E]."

 autoedu_editor_preset_description_1:0 "Обучает ваших потомков в конфессии и культуре правителя, используя заданный порядок приоритетов фокуса образования.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по заданному порядку приоритетов.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_2:0 "Потомки: дипломатия"
 autoedu_editor_preset_description_2:0 "Обучает ваших потомков в конфессии и культуре правителя с упором на дипломатию.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по приоритету слева направо: дипломатия, интриги, ученость, управление, военное дело.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_3:0 "Потомки: военное дело"
 autoedu_editor_preset_description_3:0 "Обучает ваших потомков в конфессии и культуре правителя с упором на военное дело.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по приоритету слева направо: военное дело, управление, дипломатия, интриги, ученость.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_4:0 "Потомки: управление"
 autoedu_editor_preset_description_4:0 "Обучает ваших потомков в конфессии и культуре правителя с упором на управление.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по приоритету слева направо: управление, ученость, дипломатия, военное дело, интриги.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_5:0 "Потомки: Интриги"
 autoedu_editor_preset_description_5:0 "Обучает ваших потомков в конфессии и культуре правителя с упором на интриги.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по приоритету слева направо: интриги, дипломатия, управление, ученость, военное дело.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_6:0 "Потомки: ученость"
 autoedu_editor_preset_description_6:0 "Обучает ваших потомков в конфессии и культуре правителя с упором на ученость.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Выбирает @skill_learning_icon! [Concept( 'education_focus', 'фокус образования' )|E] по приоритету слева направо: ученость, управление, дипломатия, интриги, военное дело.\n$autoedu_editor_preset_common_rule_6$"

