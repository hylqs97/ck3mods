 autoedu.0120.t:0 "Опекун покинул этот мир"
 autoedu.0120.desc:0 "Смерть прежнего опекуна оставила [autoedu_child.GetShortUIName] без твердой руки и ежедневного наставления. Если быстро не найти замену, качество образования может пострадать."
 autoedu.0120.choose:0 "Найти нового [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.0120.wait_cleanup:0 "Подождать, пока [Concept( 'court', 'двор' )|E] разберется с формальностями."
 autoedu.0120.postpone:0 "Решить позже."
 autoedu.0120.ignore:0 "Больше не вмешиваться в воспитание этого ребенка."
 autoedu.tt.guardian_dead_choose:0 "При необходимости сначала будет выбран [Concept( 'education_focus', 'фокус образования' )|E], затем [Concept( 'guardian', 'опекун' )|E] по текущим настройкам."
 autoedu.tt.guardian_dead_wait_cleanup:0 "У ребенка все еще числится [Concept( 'guardian', 'опекун' )|E]. Такое бывает вскоре после смерти персонажа; через несколько дней обучение ребенка будет проверено снова."
 autoedu.tt.guardian_dead_postpone:0 "Подбор [Concept( 'guardian', 'опекуна' )|E] для этого ребенка повторится примерно через полгода."

 autoedu.1200.t:0 "Выбор фокуса образования"
 autoedu.1200.desc:0 "Детский талант [autoedu_child.GetShortUIName] уже заметен, и образование еще можно направить по подходящему пути."
 autoedu.1200.diplomacy:0 "Выбрать [Concept( 'diplomacy', 'дипломатию' )|E]"
 autoedu.1200.martial:0 "Выбрать [Concept( 'martial', 'военное дело' )|E]"
 autoedu.1200.stewardship:0 "Выбрать [Concept( 'stewardship', 'управление' )|E]"
 autoedu.1200.intrigue:0 "Выбрать: [Concept( 'intrigue', 'Интриги' )|E]"
 autoedu.1200.learning:0 "Выбрать [Concept( 'learning', 'ученость' )|E]"
 autoedu.1200.skip:0 "Не менять [Concept( 'education_focus', 'фокус' )|E]."
 autoedu.tt.focus_diplomacy:0 "[Concept( 'diplomacy', 'Дипломатия' )|E] хорошо сочетается с [Concept( 'childhood_trait', 'детскими талантами' )|E] [GetTrait('charming').GetName( GetNullCharacter )|l] и [GetTrait('curious').GetName( GetNullCharacter )|l]. Это направление также поможет при подборе подходящего [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.tt.focus_martial:0 "[Concept( 'martial', 'Военное дело' )|E] хорошо сочетается с [Concept( 'childhood_trait', 'детскими талантами' )|E] [GetTrait('bossy').GetName( GetNullCharacter )|l] и [GetTrait('rowdy').GetName( GetNullCharacter )|l]. Это направление также поможет при подборе подходящего [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.tt.focus_stewardship:0 "[Concept( 'stewardship', 'Управление' )|E] хорошо сочетается с [Concept( 'childhood_trait', 'детскими талантами' )|E] [GetTrait('bossy').GetName( GetNullCharacter )|l] и [GetTrait('pensive').GetName( GetNullCharacter )|l]. Это направление также поможет при подборе подходящего [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.tt.focus_intrigue:0 "[Concept( 'intrigue', 'Интриги' )|E] хорошо сочетаются с [Concept( 'childhood_trait', 'детскими талантами' )|E] [GetTrait('charming').GetName( GetNullCharacter )|l] и [GetTrait('rowdy').GetName( GetNullCharacter )|l]. Это направление также поможет при подборе подходящего [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.tt.focus_learning:0 "[Concept( 'learning', 'Ученость' )|E] хорошо сочетается с [Concept( 'childhood_trait', 'детскими талантами' )|E] [GetTrait('curious').GetName( GetNullCharacter )|l] и [GetTrait('pensive').GetName( GetNullCharacter )|l]. Это направление также поможет при подборе подходящего [Concept( 'guardian', 'опекуна' )|E]."
 autoedu.tt.focus_skip:0 "Пока не выбирать [Concept( 'education_focus', 'фокус образования' )|E]. Подбор [Concept( 'guardian', 'опекуна' )|E] продолжится, если он включен."

 autoedu.2000.t:0 "Образование в университете"
 autoedu.2000.desc:0 "Для [autoedu_university_child.GetShortUIName] открылась возможность продолжить обучение в университете за пределами привычного двора."
 autoedu.2000.a:0 "Оплатить обучение и отправить ребенка в университет."
 autoedu.2000.b:0 "Не сейчас."
 autoedu.2000.c:0 "Больше не возвращаться к этому вопросу."
 autoedu.tt.university_no_gold:0 "Недостаточно [Concept( 'gold', 'золота' )|E], чтобы оплатить университет и сохранить выбранный резерв."
 autoedu.4100.t:0 "Пример опекуна"
 autoedu.4100.desc:0 "С каждым новым уроком [autoedu_personality_child.GetShortUIName] все внимательнее прислушивается к моим словам и следует моему примеру. Возможно, сейчас я смогу направить характер подопечного в знакомую мне сторону."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Оставить на потом"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "Урок военного искусства"
 autoedu.4150.desc:0 "Одних карт и наставлений недостаточно. [autoedu_martial_training_child.GetShortUIName] пора познакомиться с тем, чему меня научили собственные походы и сражения. Возможно, мне удастся передать подопечному одно из своих свойств командира."
 autoedu.4200.t:0 "Ребенок готов к детскому экзамену"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] [Select_CString( autoedu_child_exam_child.IsFemale, 'готова', 'готов' )] к детскому экзамену. Успех на нем может дать ребенку хороший старт во взрослой жизни, но для организации попытки потребуется ваше влияние."
 autoedu.4200.send:0 "Послать на детский экзамен"
 autoedu.4200.later:0 "Не сейчас."
 autoedu.tt.child_exam_send:0 "Потратить [Concept( 'influence', 'влияние' )|E], чтобы отправить [autoedu_child_exam_child.GetShortUIName] на [Concept( 'childrens_examination', 'детский экзамен' )|E]."

 autoedu.3900.t:0 "Подходящих детей нет"
 autoedu.3900.desc:0 "По текущим правилам образования подходящих детей не найдено."
 autoedu.3900.ok:0 "Хорошо."

 autoedu.3901.t:0 "Подходящий опекун не найден"
 autoedu.3901.desc:0 "Для [autoedu_child.GetShortUIName] можно назначить опекуна, но по текущим требованиям подходящей кандидатуры не найдено. Остальные подходящие дети также были проверены."
 autoedu.3902.t:0 "Опеку сейчас назначить нельзя"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] относится к действующей образовательной политике, но нынешний двор ребенка сейчас не позволяет договориться об опеке. Остальные подходящие дети также были проверены."
 autoedu.3903.t:0 "Поиск опекуна отложен"
 autoedu.3903.desc:0 "Новый поиск опекуна для [autoedu_child.GetShortUIName] временно отложен. Остальные подходящие дети также были проверены."
 autoedu.3904.t:0 "Опека сейчас недоступна"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] относится к действующей образовательной политике, но сейчас назначить опекуна невозможно. Остальные подходящие дети также были проверены."

 autoedu_guardian_assigned_title:0 "Назначен опекун"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] берет под свое попечение [autoedu_child.GetShortUIName] и направляет обучение в русле [autoedu_child.GetFocus.GetName]."
 autoedu_no_guardian_found_title:0 "Опекун не найден"
 autoedu_no_guardian_found_desc:0 "Для [autoedu_child.GetShortUIName] не нашлось подходящего [Concept( 'guardian', 'опекуна' )|E] при текущих правилах выбора. Возможно, стоит расширить круг кандидатов или ослабить правила выбора опекуна."
 autoedu_university_sent_title:0 "Образование в университете"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] отправляется в университет."




























