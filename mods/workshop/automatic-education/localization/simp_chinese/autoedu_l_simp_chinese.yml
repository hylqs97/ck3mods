 autoedu.0120.postpone:0 "Postpone the search."
 autoedu.0120.ignore:0 "Do not intervene in this education again."
 autoedu.tt.guardian_dead_choose:0 "If needed, an [education_focus|E] will be chosen first, then a [guardian|E] according to the current settings."
 autoedu.tt.guardian_dead_wait_cleanup:0 "The child still appears to have a [guardian|E]. This can happen briefly after a character dies; the child's education will be checked again in a few days."
 autoedu.tt.guardian_dead_postpone:0 "The search for a [guardian|E] for this child will be repeated in about half a year."

 autoedu.1200.t:0 "Choosing an Education Focus"
 autoedu.1200.desc:0 "[autoedu_child.GetShortUIName]'s childhood trait is already visible, and the child's education can still be guided toward a fitting path."
 autoedu.1200.diplomacy:0 "Choose [diplomacy|E]"
 autoedu.1200.martial:0 "Choose [martial|E]"
 autoedu.1200.stewardship:0 "Choose [stewardship|E]"
 autoedu.1200.intrigue:0 "Choose [intrigue|E]"
 autoedu.1200.learning:0 "Choose [learning|E]"
 autoedu.1200.skip:0 "Do not change the [education_focus|E]."
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E] suits [Concept( 'childhood_trait', 'Childhood Traits' )|E] such as [GetTrait('charming').GetName( GetNullCharacter )] and [GetTrait('curious').GetName( GetNullCharacter )]. This direction will also help when selecting a suitable [guardian|E]."
 autoedu.tt.focus_martial:0 "[martial|E] suits [Concept( 'childhood_trait', 'Childhood Traits' )|E] such as [GetTrait('bossy').GetName( GetNullCharacter )] and [GetTrait('rowdy').GetName( GetNullCharacter )]. This direction will also help when selecting a suitable [guardian|E]."
 autoedu.tt.focus_stewardship:0 "[stewardship|E] suits [Concept( 'childhood_trait', 'Childhood Traits' )|E] such as [GetTrait('bossy').GetName( GetNullCharacter )] and [GetTrait('pensive').GetName( GetNullCharacter )]. This direction will also help when selecting a suitable [guardian|E]."
 autoedu.tt.focus_intrigue:0 "[intrigue|E] suits [Concept( 'childhood_trait', 'Childhood Traits' )|E] such as [GetTrait('charming').GetName( GetNullCharacter )] and [GetTrait('rowdy').GetName( GetNullCharacter )]. This direction will also help when selecting a suitable [guardian|E]."
 autoedu.tt.focus_learning:0 "[learning|E] suits [Concept( 'childhood_trait', 'Childhood Traits' )|E] such as [GetTrait('curious').GetName( GetNullCharacter )] and [GetTrait('pensive').GetName( GetNullCharacter )]. This direction will also help when selecting a suitable [guardian|E]."
 autoedu.tt.focus_skip:0 "Do not choose an [education_focus|E] now. [guardian|E] selection may continue if it is enabled."

 autoedu.2000.t:0 "Education at University"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName] now has a chance to continue education at a university beyond the familiar court."
 autoedu.2000.a:0 "Pay the tuition and send the child to university."
 autoedu.2000.b:0 "Not now."
 autoedu.2000.c:0 "Do not return to this matter."
 autoedu.tt.university_no_gold:0 "You do not have enough [gold|E] to pay for University and keep the selected reserve."
 autoedu.4100.t:0 "A Guardian's Example"
 autoedu.4100.desc:0 "With every new lesson, [autoedu_personality_child.GetShortUIName] listens more closely to my words and follows my example. Perhaps now I can guide my ward's character down a path I know well."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Leave It for Now"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "A Lesson in the Art of War"
 autoedu.4150.desc:0 "Maps and instruction alone are not enough. It is time [autoedu_martial_training_child.GetShortUIName] learned what my own campaigns and battles have taught me. Perhaps I can pass one of my commander traits on to my ward."
 autoedu.4200.t:0 "Ready for the Children's Examination"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] is ready to take the Children's Examination. Success in the examination could give the child a strong start in adult life, but arranging the attempt will require your Influence."
 autoedu.4200.send:0 "Send to Children's Examination"
 autoedu.4200.later:0 "Not now."
 autoedu.tt.child_exam_send:0 "Spend [influence|E] to send [autoedu_child_exam_child.GetShortUIName] to the [childrens_examination|E]."

 autoedu.3900.t:0 "No Eligible Children"
 autoedu.3900.desc:0 "No eligible children were found under the current education rules."
 autoedu.3900.ok:0 "Understood."

 autoedu.3901.t:0 "No Suitable Guardian"
 autoedu.3901.desc:0 "[autoedu_child.GetShortUIName] is ready for guardianship, but no suitable guardian could be found under the current requirements. Other eligible children were also checked."
 autoedu.3902.t:0 "Guardianship Unavailable"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] falls under an active education policy, but the child's current court will not allow a guardianship arrangement at this time. Other eligible children were also checked."
 autoedu.3903.t:0 "Guardian Search Postponed"
 autoedu.3903.desc:0 "A new guardian search for [autoedu_child.GetShortUIName] is temporarily postponed. Other eligible children were also checked."
 autoedu.3904.t:0 "Guardianship Currently Unavailable"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] falls under an active education policy, but guardianship cannot be arranged at this time. Other eligible children were also checked."

 autoedu_guardian_assigned_title:0 "Guardian Appointed"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] takes [autoedu_child.GetShortUIName] under tutelage, guiding the child's education toward [autoedu_child.GetFocus.GetName]."
 autoedu_no_guardian_found_title:0 "No Guardian Found"
 autoedu_no_guardian_found_desc:0 "No suitable [guardian|E] could be found for [autoedu_child.GetShortUIName] under the current selection rules. Consider widening the candidate pool or easing the current guardian rules."
 autoedu_university_sent_title:0 "University Education"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] has been sent to university."




























