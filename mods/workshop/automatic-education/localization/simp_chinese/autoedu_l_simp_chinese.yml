 autoedu_editor_editor_preset_1:0 "Descendants"
 autoedu_editor_preset_common_rules_1_4:0 "1. Covers the [Concept( 'primary_heir', 'primary heir' )|E], the ruler's [Concept( 'children', 'children' )|E], grandchildren and great-grandchildren.\n2. Automatically assigns [Concept( 'guardian', 'guardians' )|E] from among the ruler's @courtier_icon! [Concept( 'courtiers', 'courtiers' )|E], @autoedu_close_family_icon! [Concept( 'close_family_members', 'Close Family Members' )|E] and @autoedu_house_icon! [Concept( 'house', 'house' )|E] members.\n3. Selects only guardians who share the ruler's @religious_icon! [Concept( 'faith', 'faith' )|E] and @culture_icon! [Concept( 'culture', 'culture' )|E]. Age, gender and witchcraft are ignored.\n4. Changes the child's @religious_icon! [Concept( 'faith', 'faith' )|E] and @culture_icon! [Concept( 'culture', 'culture' )|E] to the guardian's faith and culture."
 autoedu_editor_preset_common_rule_6:0 "6. Does not send children to @building_icon! university or to the @child_exam_icon! [Concept( 'childrens_examination', 'Children’s Examination' )|E]."

 autoedu_editor_preset_description_1:0 "Educates your descendants in the ruler's faith and culture, using the configured Education Focus priorities.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selects @skill_learning_icon! the [Concept( 'education_focus', 'education focus' )|E] using the configured priority order.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_2:0 "Descendants: Diplomacy"
 autoedu_editor_preset_description_2:0 "Educates your descendants in the ruler's faith and culture with an emphasis on Diplomacy.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selects @skill_learning_icon! the [Concept( 'education_focus', 'education focus' )|E] by priority from left to right: diplomacy, intrigue, learning, stewardship, martial.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_3:0 "Descendants: Martial"
 autoedu_editor_preset_description_3:0 "Educates your descendants in the ruler's faith and culture with an emphasis on Martial education.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selects @skill_learning_icon! the [Concept( 'education_focus', 'education focus' )|E] by priority from left to right: martial, stewardship, diplomacy, intrigue, learning.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_4:0 "Descendants: Stewardship"
 autoedu_editor_preset_description_4:0 "Educates your descendants in the ruler's faith and culture with an emphasis on Stewardship.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selects @skill_learning_icon! the [Concept( 'education_focus', 'education focus' )|E] by priority from left to right: stewardship, learning, diplomacy, martial, intrigue.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_5:0 "Descendants: Intrigue"
 autoedu_editor_preset_description_5:0 "Educates your descendants in the ruler's faith and culture with an emphasis on Intrigue.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Selects @skill_learning_icon! the [Concept( 'education_focus', 'education focus' )|E] by priority from left to right: intrigue, diplomacy, stewardship, learning, martial.\n$autoedu_editor_preset_common_rule_6$"
