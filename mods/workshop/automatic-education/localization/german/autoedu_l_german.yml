 autoedu_editor_preset_common_rules_1_4:0 "1. Umfasst den [Concept( 'primary_heir', 'Haupterben' )|E], die [Concept( 'children', 'Kinder' )|E] des Herrschers, Enkel und Urenkel.\n2. Weist automatisch [Concept( 'guardian', 'Vormünder' )|E] unter den @courtier_icon! [Concept( 'courtiers', 'Höflingen' )|E] des Herrschers, @autoedu_close_family_icon! [Concept( 'close_family_members', 'nahen Verwandten' )|E] und Mitgliedern des @autoedu_house_icon! [Concept( 'house', 'Hauses' )|E] zu.\n3. Wählt nur Vormünder mit demselben @religious_icon! [Concept( 'faith', 'Glauben' )|E] und derselben @culture_icon! [Concept( 'culture', 'Kultur' )|E] wie der Herrscher. Alter, Geschlecht und Hexerei werden ignoriert.\n4. Ändert @religious_icon! [Concept( 'faith', 'Glauben' )|E] und @culture_icon! [Concept( 'culture', 'Kultur' )|E] des Kindes auf Glauben und Kultur des Vormunds."
 autoedu_editor_preset_common_rule_6:0 "6. Schickt Kinder weder an die @building_icon! Universität noch zur @child_exam_icon! [Concept( 'childrens_examination', 'Kinderprüfung' )|E]."

