 autoedu.0120.t:0 "Der Vormund ist gestorben"
 autoedu.0120.desc:0 "Der Vormund von [autoedu_child.GetShortUIName] ist gestorben. Ein neuer Mentor kann sofort gewählt werden, damit die Erziehung des Kindes nicht ihre Richtung verliert."
 autoedu.0120.choose:0 "Einen neuen [guardian|E] wählen."
 autoedu.0120.wait_cleanup:0 "Warten, bis der [court|E] die Formalitäten geklärt hat."
 autoedu.0120.postpone:0 "Die Suche verschieben."
 autoedu.0120.ignore:0 "Nicht erneut in diese Erziehung eingreifen."
 autoedu.tt.guardian_dead_choose:0 "Falls nötig, wird zuerst ein [education_focus|E] gewählt, danach ein [guardian|E] gemäß den aktuellen Einstellungen."
 autoedu.tt.guardian_dead_wait_cleanup:0 "Das Kind scheint noch einen [guardian|E] zu haben. Das kann kurz nach dem Tod eines Charakters vorkommen; seine Erziehung wird in einigen Tagen erneut geprüft."
 autoedu.tt.guardian_dead_postpone:0 "Die Suche nach einem [guardian|E] für dieses Kind wird in etwa einem halben Jahr wiederholt."

 autoedu.1200.t:0 "Ausbildungsschwerpunkt wählen"
 autoedu.1200.desc:0 "Die Kindheitseigenschaft von [autoedu_child.GetShortUIName] ist bereits sichtbar, und die Bildung kann noch auf einen passenden Weg gelenkt werden."
 autoedu.1200.diplomacy:0 "[diplomacy|E] wählen"
 autoedu.1200.martial:0 "[martial|E] wählen"
 autoedu.1200.stewardship:0 "[stewardship|E] wählen"
 autoedu.1200.intrigue:0 "[intrigue|E] wählen"
 autoedu.1200.learning:0 "[learning|E] wählen"
 autoedu.1200.skip:0 "Den [education_focus|E] nicht ändern."
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E] passt zu [childhood_trait|E] wie [GetTrait('charming').GetName( GetNullCharacter )] und [GetTrait('curious').GetName( GetNullCharacter )]. Diese Richtung hilft auch bei der Auswahl eines passenden [guardian|E]."
 autoedu.tt.focus_martial:0 "[martial|E] passt zu [childhood_trait|E] wie [GetTrait('bossy').GetName( GetNullCharacter )] und [GetTrait('rowdy').GetName( GetNullCharacter )]. Diese Richtung hilft auch bei der Auswahl eines passenden [guardian|E]."
 autoedu.tt.focus_stewardship:0 "[stewardship|E] passt zu [childhood_trait|E] wie [GetTrait('bossy').GetName( GetNullCharacter )] und [GetTrait('pensive').GetName( GetNullCharacter )]. Diese Richtung hilft auch bei der Auswahl eines passenden [guardian|E]."
 autoedu.tt.focus_intrigue:0 "[intrigue|E] passt zu [childhood_trait|E] wie [GetTrait('charming').GetName( GetNullCharacter )] und [GetTrait('rowdy').GetName( GetNullCharacter )]. Diese Richtung hilft auch bei der Auswahl eines passenden [guardian|E]."
 autoedu.tt.focus_learning:0 "[learning|E] passt zu [childhood_trait|E] wie [GetTrait('curious').GetName( GetNullCharacter )] und [GetTrait('pensive').GetName( GetNullCharacter )]. Diese Richtung hilft auch bei der Auswahl eines passenden [guardian|E]."
 autoedu.tt.focus_skip:0 "Jetzt keinen [education_focus|E] wählen. Die Auswahl des [guardian|E] kann fortgesetzt werden, wenn sie aktiviert ist."

 autoedu.2000.t:0 "Bildung an der Universität"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName] hat nun die Möglichkeit, die Ausbildung an einer Universität außerhalb des vertrauten Hofes fortzusetzen."
 autoedu.2000.a:0 "Für die Ausbildung zahlen und das Kind zur Universität schicken."
 autoedu.2000.b:0 "Nicht jetzt."
 autoedu.2000.c:0 "Darauf nicht zurückkommen."
 autoedu.tt.university_no_gold:0 "Ihr habt nicht genug [gold|E], um die Universität zu bezahlen und die gewählte Reserve zu behalten."
 autoedu.4100.t:0 "Das Vorbild des Vormunds"
 autoedu.4100.desc:0 "Mit jeder neuen Lektion hört [autoedu_personality_child.GetShortUIName] aufmerksamer auf meine Worte und folgt meinem Beispiel. Vielleicht kann ich den Charakter meines Mündels nun in eine Richtung lenken, die mir vertraut ist."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Für später belassen"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "Eine Lektion in der Kriegskunst"
 autoedu.4150.desc:0 "Karten und Unterweisungen allein genügen nicht. Es ist Zeit, dass [autoedu_martial_training_child.GetShortUIName] erfährt, was mich meine eigenen Feldzüge und Schlachten gelehrt haben. Vielleicht kann ich eine meiner Befehlshabereigenschaften an mein Mündel weitergeben."
 autoedu.4200.t:0 "Bereit für die Kinderprüfung"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] ist bereit für die Kinderprüfung. Erfolg bei der Prüfung könnte dem Kind einen guten Start ins Erwachsenenleben geben, doch die Vorbereitung erfordert Euren Einfluss."
 autoedu.4200.send:0 "Zur Kinderprüfung schicken"
 autoedu.4200.later:0 "Nicht jetzt."
 autoedu.tt.child_exam_send:0 "Gebt [influence|E] aus, um [autoedu_child_exam_child.GetShortUIName] zur [Concept( 'childrens_examination', 'Kinderprüfung' )|E] zu schicken."

 autoedu.3900.t:0 "Keine geeigneten Kinder"
 autoedu.3900.desc:0 "Nach den aktuellen Erziehungsregeln wurden keine geeigneten Kinder gefunden."
 autoedu.3900.ok:0 "Verstanden."

 autoedu.3901.t:0 "Kein geeigneter Vormund"
 autoedu.3901.desc:0 "Für [autoedu_child.GetShortUIName] kann ein Vormund gesucht werden, doch unter den derzeitigen Anforderungen wurde niemand Geeignetes gefunden. Auch die übrigen infrage kommenden Kinder wurden geprüft."
 autoedu.3902.t:0 "Vormundschaft nicht möglich"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] fällt unter eine aktive Bildungspolitik, doch der derzeitige Hof des Kindes lässt eine Vormundschaft im Moment nicht zu. Auch die übrigen infrage kommenden Kinder wurden geprüft."
 autoedu.3903.t:0 "Vormundsuche aufgeschoben"
 autoedu.3903.desc:0 "Die erneute Suche nach einem Vormund für [autoedu_child.GetShortUIName] ist vorübergehend aufgeschoben. Auch die übrigen infrage kommenden Kinder wurden geprüft."
 autoedu.3904.t:0 "Vormundschaft derzeit nicht möglich"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] fällt unter eine aktive Bildungspolitik, doch derzeit kann keine Vormundschaft eingerichtet werden. Auch die übrigen infrage kommenden Kinder wurden geprüft."

 autoedu_guardian_assigned_title:0 "Vormund ernannt"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] nimmt [autoedu_child.GetShortUIName] unter seine Obhut und richtet die Erziehung des Kindes auf [autoedu_child.GetFocus.GetName] aus."
 autoedu_no_guardian_found_title:0 "Kein Vormund gefunden"
 autoedu_no_guardian_found_desc:0 "Für [autoedu_child.GetShortUIName] wurde unter den aktuellen Auswahlregeln kein geeigneter [guardian|E] gefunden. Erwägt, den Kandidatenkreis zu erweitern oder die Regeln für Vormünder zu lockern."
 autoedu_university_sent_title:0 "Universitätsbildung"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] wurde zur Universität geschickt."




























