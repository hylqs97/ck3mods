 autoedu_editor_preset_description_3:0 "Kształci twoich potomków w wierze i kulturze władcy ze szczególnym naciskiem na Walkę.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Wybiera @skill_learning_icon! [Concept( 'education_focus', 'priorytet edukacji' )|E] według priorytetu od lewej do prawej: walka, zarządzanie, dyplomacja, intryga, nauka.\n$autoedu_editor_preset_common_rule_6$"
