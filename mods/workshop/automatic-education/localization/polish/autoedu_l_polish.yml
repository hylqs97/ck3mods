 autoedu.0120.t:0 "Opiekun zmarł"
 autoedu.0120.desc:0 "Opiekun [autoedu_child.GetShortUIName] zmarł. Można od razu wybrać nowego mentora, aby edukacja dziecka nie straciła kierunku."
 autoedu.0120.choose:0 "Wybierz nowego [guardian|E]."
 autoedu.0120.wait_cleanup:0 "Poczekaj, aż [court|E] załatwi formalności."
 autoedu.0120.postpone:0 "Odłóż poszukiwania."
 autoedu.0120.ignore:0 "Nie ingeruj ponownie w tę edukację."
 autoedu.tt.guardian_dead_choose:0 "W razie potrzeby najpierw zostanie wybrany [education_focus|E], a potem [guardian|E] zgodnie z obecnymi ustawieniami."
 autoedu.tt.guardian_dead_wait_cleanup:0 "Dziecko nadal wydaje się mieć [guardian|E]. Może się tak zdarzyć krótko po śmierci postaci; jego edukacja zostanie ponownie sprawdzona za kilka dni."
 autoedu.tt.guardian_dead_postpone:0 "Poszukiwanie [guardian|E] dla tego dziecka zostanie powtórzone za około pół roku."

 autoedu.1200.t:0 "Wybór priorytetu edukacji"
 autoedu.1200.desc:0 "Cecha dziecka [autoedu_child.GetShortUIName] jest już widoczna, a edukację nadal można skierować na właściwą drogę."
 autoedu.1200.diplomacy:0 "Wybierz [diplomacy|E]"
 autoedu.1200.martial:0 "Wybierz [martial|E]"
 autoedu.1200.stewardship:0 "Wybierz [stewardship|E]"
 autoedu.1200.intrigue:0 "Wybierz [intrigue|E]"
 autoedu.1200.learning:0 "Wybierz [learning|E]"
 autoedu.1200.skip:0 "Nie zmieniaj [education_focus|E]."
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E] pasuje do [childhood_trait|E], takich jak [GetTrait('charming').GetName( GetNullCharacter )] i [GetTrait('curious').GetName( GetNullCharacter )]. Ten kierunek pomoże też przy wyborze odpowiedniego [guardian|E]."
 autoedu.tt.focus_martial:0 "[martial|E] pasuje do [childhood_trait|E], takich jak [GetTrait('bossy').GetName( GetNullCharacter )] i [GetTrait('rowdy').GetName( GetNullCharacter )]. Ten kierunek pomoże też przy wyborze odpowiedniego [guardian|E]."
 autoedu.tt.focus_stewardship:0 "[stewardship|E] pasuje do [childhood_trait|E], takich jak [GetTrait('bossy').GetName( GetNullCharacter )] i [GetTrait('pensive').GetName( GetNullCharacter )]. Ten kierunek pomoże też przy wyborze odpowiedniego [guardian|E]."
 autoedu.tt.focus_intrigue:0 "[intrigue|E] pasuje do [childhood_trait|E], takich jak [GetTrait('charming').GetName( GetNullCharacter )] i [GetTrait('rowdy').GetName( GetNullCharacter )]. Ten kierunek pomoże też przy wyborze odpowiedniego [guardian|E]."
 autoedu.tt.focus_learning:0 "[learning|E] pasuje do [childhood_trait|E], takich jak [GetTrait('curious').GetName( GetNullCharacter )] i [GetTrait('pensive').GetName( GetNullCharacter )]. Ten kierunek pomoże też przy wyborze odpowiedniego [guardian|E]."
 autoedu.tt.focus_skip:0 "Nie wybieraj teraz [education_focus|E]. Wybór [guardian|E] może być kontynuowany, jeśli jest włączony."

 autoedu.2000.t:0 "Edukacja na uniwersytecie"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName] ma teraz szansę kontynuować edukację na uniwersytecie poza znanym dworem."
 autoedu.2000.a:0 "Opłać czesne i wyślij dziecko na uniwersytet."
 autoedu.2000.b:0 "Nie teraz."
 autoedu.2000.c:0 "Nie wracaj do tej sprawy."
 autoedu.tt.university_no_gold:0 "Nie masz dość [gold|E], aby opłacić uniwersytet i zachować wybraną rezerwę."
 autoedu.4100.t:0 "Przykład opiekuna"
 autoedu.4100.desc:0 "Z każdą kolejną lekcją [autoedu_personality_child.GetShortUIName] coraz uważniej słucha moich słów i bierze ze mnie przykład. Być może teraz uda mi się skierować charakter wychowanka na dobrze mi znaną drogę."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Zostaw to na później"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "Lekcja sztuki wojennej"
 autoedu.4150.desc:0 "Same mapy i nauki nie wystarczą. Teraz [autoedu_martial_training_child.GetShortUIName] może poznać to, czego nauczyły mnie własne kampanie i bitwy. Być może uda mi się przekazać wychowankowi jedną z moich cech dowódcy."
 autoedu.4200.t:0 "Gotowość do egzaminu dziecięcego"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] jest gotowe do przystąpienia do Egzaminu dziecięcego. Sukces na egzaminie może dać dziecku dobry start w dorosłym życiu, ale zorganizowanie podejścia wymaga twoich wpływów."
 autoedu.4200.send:0 "Wyślij na egzamin dziecięcy"
 autoedu.4200.later:0 "Nie teraz."
 autoedu.tt.child_exam_send:0 "Wydaj [influence|E], aby wysłać [autoedu_child_exam_child.GetShortUIName] na [Concept( 'childrens_examination', 'Egzamin dziecięcy' )|E]."

 autoedu.3900.t:0 "Brak kwalifikujących się dzieci"
 autoedu.3900.desc:0 "Przy obecnych zasadach edukacji nie znaleziono kwalifikujących się dzieci."
 autoedu.3900.ok:0 "Rozumiem."

 autoedu.3901.t:0 "Nie znaleziono odpowiedniego opiekuna"
 autoedu.3901.desc:0 "Dla postaci [autoedu_child.GetShortUIName] można szukać opiekuna, lecz nikt nie spełnia obecnych wymagań. Sprawdzono także pozostałe kwalifikujące się dzieci."
 autoedu.3902.t:0 "Opieka jest teraz niedostępna"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] podlega aktywnej polityce edukacji, lecz obecny dwór dziecka nie pozwala teraz zorganizować opieki. Sprawdzono także pozostałe kwalifikujące się dzieci."
 autoedu.3903.t:0 "Poszukiwanie opiekuna odłożone"
 autoedu.3903.desc:0 "Ponowne poszukiwanie opiekuna dla postaci [autoedu_child.GetShortUIName] jest tymczasowo odłożone. Sprawdzono także pozostałe kwalifikujące się dzieci."
 autoedu.3904.t:0 "Opieka jest obecnie niemożliwa"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] podlega aktywnej polityce edukacji, lecz obecnie nie można zorganizować opieki. Sprawdzono także pozostałe kwalifikujące się dzieci."

 autoedu_guardian_assigned_title:0 "Opiekun wyznaczony"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] obejmuje [autoedu_child.GetShortUIName] opieką i kieruje edukację dziecka ku [autoedu_child.GetFocus.GetName]."
 autoedu_no_guardian_found_title:0 "Nie znaleziono opiekuna"
 autoedu_no_guardian_found_desc:0 "Dla postaci [autoedu_child.GetShortUIName] nie znaleziono odpowiedniego [guardian|E] zgodnie z obecnymi zasadami wyboru. Rozważ poszerzenie grona kandydatów lub złagodzenie zasad wyboru opiekuna."
 autoedu_university_sent_title:0 "Edukacja uniwersytecka"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] wysłano na uniwersytet."




























