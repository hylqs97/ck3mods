 autoedu_editor_editor_preset_1:0 "Potomkowie"
 autoedu_editor_preset_common_rules_1_4:0 "1. Obejmuje [Concept( 'primary_heir', 'dziedzica głównego' )|E], [Concept( 'children', 'dzieci' )|E] władcy, wnuki i prawnuki.\n2. Automatycznie przydziela [Concept( 'guardian', 'opiekunów' )|E] spośród @courtier_icon! [Concept( 'courtiers', 'dworzan' )|E] władcy, @autoedu_close_family_icon! [Concept( 'close_family_members', 'członków bliskiej rodziny' )|E] i członków jego @autoedu_house_icon! [Concept( 'house', 'rodu' )|E].\n3. Wybiera tylko opiekunów wyznających tę samą @religious_icon! [Concept( 'faith', 'wiarę' )|E] i należących do tej samej @culture_icon! [Concept( 'culture', 'kultury' )|E] co władca. Wiek, płeć i czary są ignorowane.\n4. Zmienia @religious_icon! [Concept( 'faith', 'wiarę' )|E] i @culture_icon! [Concept( 'culture', 'kulturę' )|E] dziecka na wiarę i kulturę opiekuna."
 autoedu_editor_preset_common_rule_6:0 "6. Nie wysyła dzieci na @building_icon! uniwersytet ani na @child_exam_icon! [Concept( 'childrens_examination', 'Egzamin dziecięcy' )|E]."

 autoedu_editor_preset_description_1:0 "Kształci twoich potomków w wierze i kulturze władcy, używając skonfigurowanej kolejności priorytetów edukacji.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Wybiera @skill_learning_icon! [Concept( 'education_focus', 'priorytet edukacji' )|E] według skonfigurowanej kolejności priorytetów.\n$autoedu_editor_preset_common_rule_6$"
 autoedu_editor_editor_preset_2:0 "Potomkowie: Dyplomacja"
 autoedu_editor_preset_description_2:0 "Kształci twoich potomków w wierze i kulturze władcy ze szczególnym naciskiem na Dyplomację.\n\n$autoedu_editor_preset_common_rules_1_4$\n5. Wybiera @skill_learning_icon! [Concept( 'education_focus', 'priorytet edukacji' )|E] według priorytetu od lewej do prawej: dyplomacja, intryga, nauka, zarządzanie, walka.\n$autoedu_editor_preset_common_rule_6$"
