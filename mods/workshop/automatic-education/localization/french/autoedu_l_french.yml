 autoedu_editor_editor_preset_1:0 "Descendants"
 autoedu_editor_preset_common_rules_1_4:0 "1. Couvre le [Concept( 'primary_heir', 'principal héritier' )|E], les [Concept( 'children', 'enfants' )|E] du dirigeant, les petits-enfants et les arrière-petits-enfants.\n2. Attribue automatiquement des [Concept( 'guardian', 'tuteurs' )|E] parmi les @courtier_icon! [Concept( 'courtiers', 'courtisans' )|E] du dirigeant, ses @autoedu_close_family_icon! [Concept( 'close_family_members', 'membres de la proche famille' )|E] et les membres de sa @autoedu_house_icon! [Concept( 'house', 'Maison' )|E].\n3. Ne choisit que des tuteurs ayant la même @religious_icon! [Concept( 'faith', 'foi' )|E] et la même @culture_icon! [Concept( 'culture', 'culture' )|E] que le dirigeant. L’âge, le sexe et la sorcellerie sont ignorés.\n4. Change la @religious_icon! [Concept( 'faith', 'foi' )|E] et la @culture_icon! [Concept( 'culture', 'culture' )|E] de l’enfant pour celles du tuteur."
 autoedu_editor_preset_common_rule_6:0 "6. N’envoie les enfants ni à l’@building_icon! université ni à l’@child_exam_icon! [Concept( 'childrens_examination', 'Examen des enfants' )|E]."

