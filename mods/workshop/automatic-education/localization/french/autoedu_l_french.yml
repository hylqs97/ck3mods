 autoedu.0120.t:0 "Le tuteur est mort"
 autoedu.0120.desc:0 "Le tuteur de [autoedu_child.GetShortUIName] est mort. Un nouveau mentor peut être choisi sans attendre afin que l'éducation de l'enfant ne perde pas sa direction."
 autoedu.0120.choose:0 "Choisir un nouveau [guardian|E]."
 autoedu.0120.wait_cleanup:0 "Attendre que la [court|E] règle les formalités."
 autoedu.0120.postpone:0 "Reporter la recherche."
 autoedu.0120.ignore:0 "Ne plus intervenir dans cette éducation."
 autoedu.tt.guardian_dead_choose:0 "Si nécessaire, un [education_focus|E] sera d'abord choisi, puis un [guardian|E] selon les paramètres actuels."
 autoedu.tt.guardian_dead_wait_cleanup:0 "L’enfant semble encore avoir un [guardian|E]. Cela peut arriver brièvement après la mort d’un personnage ; son éducation sera vérifiée de nouveau dans quelques jours."
 autoedu.tt.guardian_dead_postpone:0 "La recherche d’un [guardian|E] pour cet enfant sera relancée dans environ six mois."

 autoedu.1200.t:0 "Choix d’un intérêt d’éducation"
 autoedu.1200.desc:0 "Le trait d'enfance de [autoedu_child.GetShortUIName] est déjà visible, et son éducation peut encore être orientée vers une voie adaptée."
 autoedu.1200.diplomacy:0 "Choisir la [diplomacy|E]"
 autoedu.1200.martial:0 "Choisir le [martial|E]"
 autoedu.1200.stewardship:0 "Choisir l'[stewardship|E]"
 autoedu.1200.intrigue:0 "Choisir l'[intrigue|E]"
 autoedu.1200.learning:0 "Choisir l'[learning|E]"
 autoedu.1200.skip:0 "Ne pas modifier le [education_focus|E]."
 autoedu.tt.focus_diplomacy:0 "La [diplomacy|E] convient aux [childhood_trait|E] tels que [GetTrait('charming').GetName( GetNullCharacter )] et [GetTrait('curious').GetName( GetNullCharacter )]. Cette direction aidera aussi à choisir un [guardian|E] adapté."
 autoedu.tt.focus_martial:0 "Le [martial|E] convient aux [childhood_trait|E] tels que [GetTrait('bossy').GetName( GetNullCharacter )] et [GetTrait('rowdy').GetName( GetNullCharacter )]. Cette direction aidera aussi à choisir un [guardian|E] adapté."
 autoedu.tt.focus_stewardship:0 "L'[stewardship|E] convient aux [childhood_trait|E] tels que [GetTrait('bossy').GetName( GetNullCharacter )] et [GetTrait('pensive').GetName( GetNullCharacter )]. Cette direction aidera aussi à choisir un [guardian|E] adapté."
 autoedu.tt.focus_intrigue:0 "L'[intrigue|E] convient aux [childhood_trait|E] tels que [GetTrait('charming').GetName( GetNullCharacter )] et [GetTrait('rowdy').GetName( GetNullCharacter )]. Cette direction aidera aussi à choisir un [guardian|E] adapté."
 autoedu.tt.focus_learning:0 "L'[learning|E] convient aux [childhood_trait|E] tels que [GetTrait('curious').GetName( GetNullCharacter )] et [GetTrait('pensive').GetName( GetNullCharacter )]. Cette direction aidera aussi à choisir un [guardian|E] adapté."
 autoedu.tt.focus_skip:0 "Ne pas choisir de [education_focus|E] maintenant. Le choix du [guardian|E] peut continuer s'il est activé."

 autoedu.2000.t:0 "Éducation à l'université"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName] a maintenant une chance de poursuivre son éducation dans une université au-delà de la cour familière."
 autoedu.2000.a:0 "Payer les frais d'études et envoyer l'enfant à l'université."
 autoedu.2000.b:0 "Pas maintenant."
 autoedu.2000.c:0 "Ne plus revenir sur cette question."
 autoedu.tt.university_no_gold:0 "Vous n'avez pas assez d'[gold|E] pour payer l'université et conserver la réserve choisie."
 autoedu.4100.t:0 "L’exemple du tuteur"
 autoedu.4100.desc:0 "À chaque nouvelle leçon, [autoedu_personality_child.GetShortUIName] prête davantage attention à mes paroles et suit mon exemple. Peut-être puis-je maintenant orienter le caractère de mon pupille dans une direction qui m’est familière."
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "Laisser cela pour plus tard"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "Une leçon sur l’art de la guerre"
 autoedu.4150.desc:0 "Les cartes et les enseignements ne suffisent pas. Il est temps que [autoedu_martial_training_child.GetShortUIName] découvre ce que mes propres campagnes et batailles m’ont appris. Peut-être parviendrai-je à transmettre à mon pupille l’un de mes traits de commandant."
 autoedu.4200.t:0 "Prêt pour l’examen des enfants"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName] est prêt à passer l’Examen des enfants. Le réussir pourrait lui donner un bon départ dans la vie adulte, mais organiser cette tentative demandera votre influence."
 autoedu.4200.send:0 "Envoyer à l’examen des enfants"
 autoedu.4200.later:0 "Pas maintenant."
 autoedu.tt.child_exam_send:0 "Dépenser de l’[influence|El] pour envoyer [autoedu_child_exam_child.GetShortUIName] à l’[Concept( 'childrens_examination', 'Examen des enfants' )|E]."

 autoedu.3900.t:0 "Aucun enfant éligible"
 autoedu.3900.desc:0 "Aucun enfant éligible n’a été trouvé avec les règles d'éducation actuelles."
 autoedu.3900.ok:0 "Compris."

 autoedu.3901.t:0 "Aucun tuteur approprié"
 autoedu.3901.desc:0 "Un tuteur peut être recherché pour [autoedu_child.GetShortUIName], mais aucun candidat approprié ne répond aux exigences actuelles. Les autres enfants concernés ont également été vérifiés."
 autoedu.3902.t:0 "Tutelle indisponible"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName] relève d'une politique d'éducation active, mais sa cour actuelle ne permet pas d'organiser sa tutelle pour le moment. Les autres enfants concernés ont également été vérifiés."
 autoedu.3903.t:0 "Recherche de tuteur reportée"
 autoedu.3903.desc:0 "La recherche d'un nouveau tuteur pour [autoedu_child.GetShortUIName] est temporairement reportée. Les autres enfants concernés ont également été vérifiés."
 autoedu.3904.t:0 "Tutelle actuellement impossible"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName] relève d'une politique d'éducation active, mais il n'est pas possible d'organiser sa tutelle pour le moment. Les autres enfants concernés ont également été vérifiés."

 autoedu_guardian_assigned_title:0 "Tuteur nommé"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName] prend [autoedu_child.GetShortUIName] sous sa tutelle et oriente l'éducation de l'enfant vers [autoedu_child.GetFocus.GetName]."
 autoedu_no_guardian_found_title:0 "Aucun tuteur trouvé"
 autoedu_no_guardian_found_desc:0 "Aucun [guardian|E] convenable n’a été trouvé pour [autoedu_child.GetShortUIName] selon les règles actuelles. Envisagez d’élargir le cercle des candidats ou d’assouplir les règles de choix du tuteur."
 autoedu_university_sent_title:0 "Éducation universitaire"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName] a été envoyé à l'université."




























