 autoedu.1000.t:0 "後見人の選択"
 autoedu.1000.desc:0 "宮廷では[autoedu_child.GetShortUIName]の将来が以前にも増して話題になっている。子供の素質も見え始め、誰に養育と教育を託すか決める時が来た。"
