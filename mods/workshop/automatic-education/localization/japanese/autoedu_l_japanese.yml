 autoedu.0120.t:0 "後見人の死"
 autoedu.0120.desc:0 "[autoedu_child.GetShortUIName]の後見人が亡くなりました。子供の教育が迷走しないよう、すぐに新たな師を選ぶことができます。"
 autoedu.0120.choose:0 "新しい[guardian|E]を選ぶ。"
 autoedu.0120.wait_cleanup:0 "[court|E]の手続きが整うのを待つ。"
 autoedu.0120.postpone:0 "探索を延期する。"
 autoedu.0120.ignore:0 "この教育には今後介入しない。"
 autoedu.tt.guardian_dead_choose:0 "必要なら先に[education_focus|E]が選ばれ、その後現在の設定に従って[guardian|E]が選ばれます。"
 autoedu.tt.guardian_dead_wait_cleanup:0 "子供にはまだ[guardian|E]がいるように見えます。人物の死亡後に一時的に起こることがあります。数日後にこの子供の教育を再確認します。"
 autoedu.tt.guardian_dead_postpone:0 "この子供の[guardian|E]探しは約半年後に再開されます。"

 autoedu.1200.t:0 "教育方針の選択"
 autoedu.1200.desc:0 "[autoedu_child.GetShortUIName]の幼少期特性はすでに見えており、教育はまだふさわしい道へ導けます。"
 autoedu.1200.diplomacy:0 "[diplomacy|E]を選ぶ"
 autoedu.1200.martial:0 "[martial|E]を選ぶ"
 autoedu.1200.stewardship:0 "[stewardship|E]を選ぶ"
 autoedu.1200.intrigue:0 "[intrigue|E]を選ぶ"
 autoedu.1200.learning:0 "[learning|E]を選ぶ"
 autoedu.1200.skip:0 "[education_focus|E]を変更しない。"
 autoedu.tt.focus_diplomacy:0 "[diplomacy|E]は[GetTrait('charming').GetName( GetNullCharacter )]や[GetTrait('curious').GetName( GetNullCharacter )]などの[childhood_trait|E]に適しています。この方向は、ふさわしい[guardian|E]を選ぶ際にも役立ちます。"
 autoedu.tt.focus_martial:0 "[martial|E]は[GetTrait('bossy').GetName( GetNullCharacter )]や[GetTrait('rowdy').GetName( GetNullCharacter )]などの[childhood_trait|E]に適しています。この方向は、ふさわしい[guardian|E]を選ぶ際にも役立ちます。"
 autoedu.tt.focus_stewardship:0 "[stewardship|E]は[GetTrait('bossy').GetName( GetNullCharacter )]や[GetTrait('pensive').GetName( GetNullCharacter )]などの[childhood_trait|E]に適しています。この方向は、ふさわしい[guardian|E]を選ぶ際にも役立ちます。"
 autoedu.tt.focus_intrigue:0 "[intrigue|E]は[GetTrait('charming').GetName( GetNullCharacter )]や[GetTrait('rowdy').GetName( GetNullCharacter )]などの[childhood_trait|E]に適しています。この方向は、ふさわしい[guardian|E]を選ぶ際にも役立ちます。"
 autoedu.tt.focus_learning:0 "[learning|E]は[GetTrait('curious').GetName( GetNullCharacter )]や[GetTrait('pensive').GetName( GetNullCharacter )]などの[childhood_trait|E]に適しています。この方向は、ふさわしい[guardian|E]を選ぶ際にも役立ちます。"
 autoedu.tt.focus_skip:0 "今は[education_focus|E]を選びません。[guardian|E]選択が有効なら続行されます。"

 autoedu.2000.t:0 "大学教育"
 autoedu.2000.desc:0 "[autoedu_university_child.GetShortUIName]は、慣れ親しんだ宮廷を離れて大学で学び続ける機会を得ました。"
 autoedu.2000.a:0 "学費を払い、子供を大学へ送る。"
 autoedu.2000.b:0 "今はやめておく。"
 autoedu.2000.c:0 "この件には戻らない。"
 autoedu.tt.university_no_gold:0 "大学の費用を払い、選択した予備金を残すには[gold|E]が足りません。"
 autoedu.4100.t:0 "後見人の手本"
 autoedu.4100.desc:0 "教えを重ねるたび、[autoedu_personality_child.GetShortUIName]は私の言葉により注意深く耳を傾け、私を手本にするようになっている。今なら、被後見人の性格を私のよく知る方向へ導けるかもしれない。"
 autoedu.4100.open:0 "$influence_child_personality_interaction$"
 autoedu.4100.later:0 "今は見送る"
 autoedu.tt.personality_open:0 "$influence_child_personality_interaction_desc$"

 autoedu.4150.t:0 "兵法の教え"
 autoedu.4150.desc:0 "地図と教えだけでは足りない。[autoedu_martial_training_child.GetShortUIName]には、私自身の遠征と戦いから学んだことを知る時が来た。うまくいけば、私の指揮官特性の一つを被後見人に伝えられるかもしれない。"
 autoedu.4200.t:0 "童試の準備完了"
 autoedu.4200.desc:0 "[autoedu_child_exam_child.GetShortUIName]は童試を受ける準備ができています。試験で成功すれば成人後の良い出発点になりますが、その手配にはあなたの影響力が必要です。"
 autoedu.4200.send:0 "童試へ派遣"
 autoedu.4200.later:0 "今はやめておく。"
 autoedu.tt.child_exam_send:0 "[influence|E]を使って[autoedu_child_exam_child.GetShortUIName]を[Concept( 'childrens_examination', '童試' )|E]へ送ります。"

 autoedu.3900.t:0 "対象の子供なし"
 autoedu.3900.desc:0 "現在の教育規則では、対象となる子供は見つかりませんでした。"
 autoedu.3900.ok:0 "わかった。"

 autoedu.3901.t:0 "適任の後見人が見つからない"
 autoedu.3901.desc:0 "[autoedu_child.GetShortUIName]には後見人を付けられますが、現在の条件を満たす適任者が見つかりませんでした。ほかの対象となる子供も確認されています。"
 autoedu.3902.t:0 "後見を手配できない"
 autoedu.3902.desc:0 "[autoedu_child.GetShortUIName]は有効な教育方針の対象ですが、現在いる宮廷では今のところ後見を手配できません。ほかの対象となる子供も確認されています。"
 autoedu.3903.t:0 "後見人探しを延期"
 autoedu.3903.desc:0 "[autoedu_child.GetShortUIName]の新たな後見人探しは一時的に延期されています。ほかの対象となる子供も確認されています。"
 autoedu.3904.t:0 "現在は後見を手配できない"
 autoedu.3904.desc:0 "[autoedu_child.GetShortUIName]は有効な教育方針の対象ですが、現在は後見を手配できません。ほかの対象となる子供も確認されています。"

 autoedu_guardian_assigned_title:0 "後見人任命"
 autoedu_guardian_assigned_desc:0 "[autoedu_guardian.GetShortUIName]は[autoedu_child.GetShortUIName]を指導し、子供の教育を[autoedu_child.GetFocus.GetName]へ導きます。"
 autoedu_no_guardian_found_title:0 "後見人が見つからない"
 autoedu_no_guardian_found_desc:0 "現在の選択条件では[autoedu_child.GetShortUIName]に適した[guardian|E]が見つかりませんでした。候補範囲を広げるか、後見人の条件を緩めることを検討してください。"
 autoedu_university_sent_title:0 "大学教育"
 autoedu_university_sent_desc:0 "[autoedu_university_child.GetShortUIName]は大学へ送られました。"




























