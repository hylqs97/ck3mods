 avm_protect_dynasty_decision:0 "保护所有宗族成员"
 avm_protect_dynasty_decision_desc:0 "将所有属于你宗族的封臣设为受保护，使其不受本模组任何大规模操作影响。"
 avm_protect_dynasty_decision_tooltip:0 "血脉为先。"
 avm_protect_council_decision:0 "保护所有内阁成员"
 avm_protect_council_decision_desc:0 "将所有内阁成员设为受保护，使其不受本模组任何大规模操作影响。"
 avm_protect_council_decision_tooltip:0 "我仍需要他们的谏言。"
 avm_clear_all_protection_decision:0 "清除所有保护"
 avm_clear_all_protection_decision_desc:0 "取消领国与宫廷中所有角色的保护，使其再次受到大规模操作影响。"
 avm_clear_all_protection_decision_tooltip:0 "无人可以例外。"
 avm_grant_down_to_domain_limit_decision:0 "授出领地至直辖上限"
 avm_grant_down_to_domain_limit_decision_desc:0 "逐一授出伯爵领，直到你的直辖领地数量不再超过上限，而非一次授出全部领地。绝不授予首都伯爵领。未超过上限时，此决议不可用。"
 avm_grant_down_to_domain_limit_decision_tooltip:0 "适可而止，不多分一寸。"
 avm_prefer_courtiers_decision:0 "新持有者：优先任用廷臣"
 avm_prefer_courtiers_decision_desc:0 "授予决议将优先寻找合适的成年廷臣，再考虑生成新角色。跳过内阁成员、囚犯及受保护角色。此为默认设置，可减小存档体积。"
 avm_prefer_courtiers_decision_tooltip:0 "宫廷中本就不乏贤才。"
 avm_prefer_new_characters_decision:0 "新持有者：始终生成新角色"
 avm_prefer_new_characters_decision_desc:0 "授予决议始终生成新角色，不会任用现有廷臣。长期使用会使存档中增加大量生成的角色。"
 avm_prefer_new_characters_decision_tooltip:0 "另寻新人前来。"
 avm_contracts_max_tax_decision:0 "将所有封臣契约赋税调至最高"
 avm_contracts_max_tax_decision_desc:0 "将所有封建制直属封臣的赋税义务调至最高，无视原版的君权要求。此举会招致显著的好感惩罚。跳过受保护角色。\n\n仅封建制封臣的赋税等级可以调整。部落制、神权制、共和制及牧民契约均只有一个固定等级；氏族制与行政制封臣则使用完全不同的制度，因此均不受影响。"
 avm_contracts_max_tax_decision_tooltip:0 "国库尚有诸多开支。"
 avm_contracts_max_levies_decision:0 "将所有封臣契约征召兵调至最高"
 avm_contracts_max_levies_decision_desc:0 "将所有封建制直属封臣的征召兵义务调至最高，无视原版的君权要求。此举会招致显著的好感惩罚。跳过受保护角色。\n\n仅封建制封臣的征召兵等级可以调整，其他政体不受影响。"
 avm_contracts_max_levies_decision_tooltip:0 "征集一切可用之兵。"
 avm_count_feudal_contracts_tt:0 "影响[GetPlayer.MakeScope.ScriptValue('avm_count_feudal_contract_vassals')|0]位封建制封臣；另有[GetPlayer.MakeScope.ScriptValue('avm_count_other_contract_vassals')|0]位封臣没有可调整的契约，不受影响"
 avm_contracts_reset_decision:0 "将所有封臣契约恢复常规"
 avm_contracts_reset_decision_desc:0 "将所有封建制直属封臣的赋税与征召兵义务恢复为契约初始的常规等级。可用于撤销大规模提高赋税或征召兵义务的操作；原版契约界面无法将义务降低至君权允许范围之外，因此若无此决议，这些操作将无法逆转。跳过受保护角色。"
 avm_contracts_reset_decision_tooltip:0 "恢复旧日约定。"
 avm_contracts_by_loyalty_decision:0 "按忠诚度调整封臣赋税"
 avm_contracts_by_loyalty_decision_desc:0 "根据各封建制封臣对你的好感，一次性调整其赋税义务：\n\n#weak 好感不低于50#!——苛索\n#weak 好感为0至49#!——高额\n#weak 好感为-1至-25#!——常规\n#weak 好感低于-25#!——低额\n\n向能够承受的封臣征收更多赋税，同时减轻濒临反叛者的负担，避免一视同仁地压榨所有人而催生派系。不改变征召兵义务。跳过受保护角色。"
 avm_contracts_by_loyalty_decision_tooltip:0 "各取其所能承受。"
 avm_loyalty_report_decision:0 "领国忠诚度报告"
 avm_loyalty_report_decision_desc:0 "概览直属封臣的态度。执行此决议不会改变任何状态。\n\n#weak 忠心耿耿（50及以上）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_devoted')|0]\n#weak 心满意足（0至49）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_content')|0]\n#weak 摇摆不定（-1至-25）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_wavering')|0]\n#weak 心怀敌意（低于-25）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_hostile')|0]\n\n#high 心怀不满的强力封臣：[GetPlayer.MakeScope.ScriptValue('avm_count_powerful_hostile')|0]#!\n这些人手握重兵，足以付诸行动。\n\n#weak 当前受保护者：#![GetPlayer.MakeScope.ScriptValue('avm_count_protected')|0]\n#weak 可调整契约的封建制封臣：#![GetPlayer.MakeScope.ScriptValue('avm_count_feudal_contract_vassals')|0]"
 avm_loyalty_report_decision_tooltip:0 "领国上下，究竟人心如何？"
 avm_loyalty_report_effect_tt:0 "不改变任何状态。此决议仅提供报告。"
 avm_protect_powerful_decision:0 "保护所有强力封臣"
 avm_protect_powerful_decision_desc:0 "将所有强力封臣设为受保护，使其不受本模组任何大规模操作影响。建议在解锁大规模头衔剥夺前执行，以免罢黜这些封臣，引发意料之外的战争。"
 avm_protect_powerful_decision_tooltip:0 "这些人暂且不动。"
 avm_protect_content_decision:0 "保护所有满意的封臣"
 avm_protect_content_decision_desc:0 "将所有对你好感不低于0的封臣设为受保护。与“剥夺不忠封臣的全部头衔”相辅相成：先执行此决议，再按任意条件剥夺头衔，即可使忠诚封臣免受影响。"
 avm_protect_content_decision_tooltip:0 "善待恪尽本分之人。"
