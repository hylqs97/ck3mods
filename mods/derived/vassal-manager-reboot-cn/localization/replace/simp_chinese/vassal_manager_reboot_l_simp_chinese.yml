l_simp_chinese:
 revoke_every_title_decision:0 "剥夺领内全部头衔"
 revoke_every_title_decision_desc:0 "剥夺领内所有符合条件的头衔。名义头衔、首都男爵领及受保护角色持有的头衔不受影响。"
 revoke_every_title_decision_tooltip:0 "我需要一些独处的时光。"
 revoke_every_infidel_title_decision:0 "剥夺异信仰角色的头衔"
 revoke_every_infidel_title_decision_desc:0 "剥夺领内所有信仰与你不同的角色所持有的头衔；教廷等名义头衔不受影响。"
 revoke_every_infidel_title_decision_tooltip:0 "他们本该更加虔诚。"
 revoke_every_barbarian_title_decision:0 "剥夺异文化角色的头衔"
 revoke_every_barbarian_title_decision_desc:0 "剥夺领内所有文化与你不同的角色所持有的头衔；教廷等名义头衔不受影响。"
 revoke_every_barbarian_title_decision_tooltip:0 "他们可曾识文断字？"
 revoke_every_nondynasty_title_decision:0 "剥夺非宗族成员的全部头衔"
 revoke_every_nondynasty_title_decision_desc:0 "剥夺本宗族之外的角色所持有的头衔。宗族成员及其各级封臣不受影响。"
 revoke_every_nondynasty_title_decision_tooltip:0 "任人唯亲？绝无此事！"
 revoke_every_pinned_title_decision:0 "剥夺已关注角色的全部头衔"
 revoke_every_pinned_title_decision_desc:0 "仅剥夺已关注角色持有的头衔。他们的封臣及下级封臣若未被关注，则不会失去头衔。"
 revoke_every_pinned_title_decision_tooltip:0 "尔等皆当退下！"
 revoke_every_notpinned_title_decision:0 "剥夺未关注角色的全部头衔"
 revoke_every_notpinned_title_decision_desc:0 "剥夺未关注角色持有的头衔。已关注角色及其各级封臣均不受影响。"
 revoke_every_notpinned_title_decision_tooltip:0 "受我关注者留下，其余人等退下。"
 grant_cities_decision:0 "授予城市"
 grant_cities_decision_desc:0 "将城市授予随机生成的能干商人。"
 grant_cities_decision_tooltip:0 "为我寻来精明的商人。"
 grant_temples_decision:0 "授予神殿"
 grant_temples_decision_desc:0 "将神殿授予随机生成的博学学者。"
 grant_temples_decision_tooltip:0 "你竟打算铸造一座黄金祭坛？"
 grant_castles_decision:0 "授予城堡"
 grant_castles_decision_desc:0 "将城堡授予随机生成的善战勇士。"
 grant_castles_decision_tooltip:0 "这些城墙造价不菲，务必守好！"
 grant_counties_decision:0 "授予伯爵领"
 grant_counties_decision_desc:0 "将伯爵领授予随机生成的能干角色，但不包括你主公爵领内的伯爵领。"
 grant_counties_decision_tooltip:0 "只要你们按时纳税……"
 grant_duchies_decision:0 "授予公爵领"
 grant_duchies_decision_desc:0 "将每个公爵领授予该公爵领法理范围内随机选出的一名伯爵；不包括你的主公爵领。"
 grant_duchies_decision_tooltip:0 "别让农民来烦我。"
 grant_kingdoms_decision:0 "授予王国"
 grant_kingdoms_decision_desc:0 "将每个王国授予该王国法理范围内随机选出的一名公爵；不包括你的主王国。"
 grant_kingdoms_decision_tooltip:0 "莫要背叛于我。"
 grant_duchies_to_dynasty_decision:0 "向宗族成员授予公爵领"
 grant_duchies_to_dynasty_decision_desc:0 "将公爵领及其法理伯爵领授予尚未持有公爵领的宗族成员。若相关法理伯爵领已有封臣，也会一并转封。"
 grant_duchies_to_dynasty_decision_tooltip:0 "或许这确实是任人唯亲。"
 convert_subjects_faith_decision:0 "改变臣民信仰"
 convert_subjects_faith_decision_desc:0 "使所有臣民改信你的信仰。"
 convert_subjects_faith_decision_tooltip:0 "奉行你们君主的信仰！"
 depose_abdicate_decision:0 "退位并传位给继承人"
 depose_abdicate_decision_desc:0 "退位，并将君位传给你的继承人。"
 depose_abdicate_decision_tooltip:0 "我的职责已尽。"
 feudalize_all_tribal_holdings_decision:0 "将所有部落地产封建化"
 feudalize_all_tribal_holdings_decision_desc:0 "将你以封建领主身份持有的所有部落地产改为城堡。若你本人仍实行部落制，此决议不会生效。"
 feudalize_all_tribal_holdings_decision_tooltip:0 "莫再居于荒野！"
 open_advanced_vassal_manager_menu:0 "展开高级封臣管理菜单"
 close_advanced_vassal_manager_menu:0 "收起高级封臣管理菜单"
 open_advanced_vassal_manager_menu_desc:0 "展开相应菜单。"
 close_advanced_vassal_manager_menu_desc:0 "收起相应菜单。"
 open_avm_grant_titles_menu:0 "展开头衔授予菜单"
 close_avm_grant_titles_menu:0 "收起头衔授予菜单"
 open_avm_grant_titles_menu_desc:0 "展开相应菜单。"
 close_avm_grant_titles_menu_desc:0 "收起相应菜单。"
 open_avm_revoke_titles_menu:0 "展开头衔剥夺菜单"
 close_avm_revoke_titles_menu:0 "收起头衔剥夺菜单"
 open_avm_revoke_titles_menu_desc:0 "展开相应菜单。"
 close_avm_revoke_titles_menu_desc:0 "收起相应菜单。"
 open_avm_misc_menu:0 "展开杂项菜单"
 close_avm_misc_menu:0 "收起杂项菜单"
 open_avm_misc_menu_desc:0 "展开相应菜单。"
 close_avm_misc_menu_desc:0 "收起相应菜单。"
 CONFIRM_OKAY:0 "确认"
 avm_arm_mass_revocation_decision:0 "解锁大规模头衔剥夺"
 avm_arm_mass_revocation_decision_desc:0 "解锁三项无法撤销的头衔剥夺决议：剥夺领内全部头衔、剥夺非宗族成员的头衔，以及剥夺未关注角色的头衔。解锁状态将在30天后自动失效。"
 avm_arm_mass_revocation_decision_tooltip:0 "取我的印玺来。"
 avm_disarm_mass_revocation_decision:0 "锁定大规模头衔剥夺"
 avm_disarm_mass_revocation_decision_desc:0 "重新锁定上述三项无法撤销的头衔剥夺决议。"
 avm_disarm_mass_revocation_decision_tooltip:0 "此事暂且作罢。"
 revoke_disloyal_vassal_titles_decision:0 "剥夺不忠封臣的全部头衔"
 revoke_disloyal_vassal_titles_decision_desc:0 "剥夺对你好感为-25或更低的角色所持有的全部头衔；名义头衔不受影响。"
 revoke_disloyal_vassal_titles_decision_tooltip:0 "你的态度已十分明确。"
 convert_tribal_vassals_feudal_decision:0 "将所有部落封臣封建化"
 convert_tribal_vassals_feudal_decision_desc:0 "将领内所有部落制封臣改为封建制，并把其部落地产改建为城堡。此操作无视原版通常要求的文化革新，并会重置所有受影响角色的继承法。"
 convert_tribal_vassals_feudal_decision_tooltip:0 "告别长屋吧。"
 convert_tribal_vassals_clan_decision:0 "将所有部落封臣改为氏族制"
 convert_tribal_vassals_clan_decision_desc:0 "将领内所有部落制封臣改为氏族制，并把其部落地产改建为城堡。此操作无视原版通常要求的文化革新，并会重置所有受影响角色的继承法。"
 convert_tribal_vassals_clan_decision_tooltip:0 "从此以家族为本。"
 avm_protect_character_interaction:0 "设为封臣管理保护对象"
 avm_protect_character_interaction_desc:0 "无论使用何种筛选条件，本模组执行的大规模头衔授予或剥夺操作都不会影响此角色。"
 avm_unprotect_character_interaction:0 "取消封臣管理保护"
 avm_unprotect_character_interaction_desc:0 "此角色将再次受到大规模操作的影响。"
 avm_requires_arming_tt:0 "请先执行本列表稍后出现的“解锁大规模头衔剥夺”决议。"
 rule_avm_disloyalty_threshold:0 "封臣管理：不忠判定阈值"
 rule_avm_disloyalty_threshold_desc:0 "设置“剥夺不忠封臣的全部头衔”所使用的好感阈值；对你好感达到或低于该值的角色会被选中。"
 setting_avm_disloyalty_moderate:0 "中等（-25）"
 setting_avm_disloyalty_moderate_desc:0 "默认设置。选中对你好感为-25或更低的封臣。"
 setting_avm_disloyalty_lenient:0 "宽松（-10）"
 setting_avm_disloyalty_lenient_desc:0 "对你好感为-10或更低的封臣也会被选中，因此影响人数较多。"
 setting_avm_disloyalty_strict:0 "严格（-50）"
 setting_avm_disloyalty_strict_desc:0 "仅选中对你好感为-50或更低的封臣。"
 rule_avm_conversion_innovations:0 "封臣管理：政体转换所需革新"
 rule_avm_conversion_innovations_desc:0 "决定部落政体转换决议是否遵循原版通常要求的文化革新条件。"
 setting_avm_conversion_ignore_innovations:0 "无视革新"
 setting_avm_conversion_ignore_innovations_desc:0 "无论文化发展程度如何，均可转换部落封臣的政体。此为默认设置。"
 setting_avm_conversion_respect_innovations:0 "遵循革新要求"
 setting_avm_conversion_respect_innovations_desc:0 "仅转换文化已具备所需革新的封臣。"
 convert_clan_vassals_feudal_decision:0 "将所有氏族封臣封建化"
 convert_clan_vassals_feudal_decision_desc:0 "将领内所有氏族制封臣改为封建制。氏族统治者已持有城堡，因此不会改动其地产。此操作会重置受影响角色的继承法；受保护角色不受影响。"
 convert_clan_vassals_feudal_decision_tooltip:0 "家族之业，改行封建之制。"
 convert_subjects_culture_decision:0 "改变臣民文化"
 convert_subjects_culture_decision_desc:0 "将所有臣民的角色文化改为你的文化。除非封臣管理的相关游戏规则另有规定，否则伯爵领文化不会改变。跳过受保护角色。"
 convert_subjects_culture_decision_tooltip:0 "请依照我们的习俗行事。"
 game_rule_category_avm_rules:0 "封臣管理"
 avm_restore_previous_holders_decision:0 "恢复上次头衔剥夺前的持有者"
 avm_restore_previous_holders_decision_desc:0 "撤销最近一次头衔剥夺造成的变更，将头衔归还给此前仍在世的持有者。此决议只记录最近一次剥夺；之后另行授出的头衔不受影响。"
 avm_restore_previous_holders_decision_tooltip:0 "思虑再三，仍由你们持有。"
 convert_realm_counties_culture_decision:0 "改变领内伯爵领文化"
 convert_realm_counties_culture_decision_desc:0 "将领国内所有伯爵领的文化改为你的文化。此操作会绕过原版文化转变机制，一次性改变领内文化。角色文化不受影响；如需改变角色文化，请使用“改变臣民文化”。"
 convert_realm_counties_culture_decision_tooltip:0 "使疆域与宫廷遵行同一习俗。"
 set_vassals_primogeniture_decision:0 "令封臣实行长子继承制"
 set_vassals_primogeniture_decision_desc:0 "将领内所有封臣的继承法设为长子继承制，无视原版的君权与革新要求。跳过受保护角色及已实行长子继承制的角色。"
 set_vassals_primogeniture_decision_tooltip:0 "一律由长子继承，无须再议。"
 set_own_titles_primogeniture_decision:0 "令自身实行长子继承制"
 set_own_titles_primogeniture_decision_desc:0 "将你自己的领国继承法设为长子继承制，无视原版的君权与革新要求。"
 set_own_titles_primogeniture_decision_tooltip:0 "先从自身做起。"
 convert_realm_counties_faith_decision:0 "改变领内伯爵领信仰"
 convert_realm_counties_faith_decision_desc:0 "将领国内所有伯爵领的信仰改为你的信仰。此操作会绕过原版宗教改信机制。角色信仰不受影响；如需改变角色信仰，请使用“改变臣民信仰”。"
 convert_realm_counties_faith_decision_tooltip:0 "所有祭坛，奉行同一信仰。"
 avm_fund_vassals_modest_decision:0 "资助封臣：少量"
 avm_fund_vassals_modest_decision_desc:0 "从你的国库向每位有领地的直属封臣拨付50金币。界面显示的是总花费；受保护角色会被跳过，也不计入费用。"
 avm_fund_vassals_modest_decision_tooltip:0 "略备资财，修缮道路。"
 avm_fund_vassals_standard_decision:0 "资助封臣：常规"
 avm_fund_vassals_standard_decision_desc:0 "从你的国库向每位有领地的直属封臣拨付150金币。界面显示的是总花费；受保护角色会被跳过，也不计入费用。"
 avm_fund_vassals_standard_decision_tooltip:0 "修建些值得称道的建筑。"
 avm_fund_vassals_lavish_decision:0 "资助封臣：丰厚"
 avm_fund_vassals_lavish_decision_desc:0 "从你的国库向每位有领地的直属封臣拨付400金币。界面显示的是总花费；受保护角色会被跳过，也不计入费用。"
 avm_fund_vassals_lavish_decision_tooltip:0 "不必吝惜开支，反正用的是我的钱。"
 avm_spawn_identity_match_land_decision:0 "新持有者：遵循当地身份"
 avm_spawn_identity_match_land_decision_desc:0 "通过授予决议生成的新角色，会采用其获授伯爵领当地的文化、信仰和外貌。此为默认设置，有助于维持征服地区的伯爵领控制力。"
 avm_spawn_identity_match_land_decision_tooltip:0 "让他们保留自己的习俗。"
 avm_spawn_identity_match_me_decision:0 "新持有者：遵循我的身份"
 avm_spawn_identity_match_me_decision_desc:0 "通过授予决议生成的新角色，会采用你的文化、信仰和外貌。若与当地居民不同，可能导致伯爵领控制力下降。"
 avm_spawn_identity_match_me_decision_tooltip:0 "我的子民，遵行我的习俗。"
 avm_spawn_identity_capital_decision:0 "新持有者：遵循首都身份"
 avm_spawn_identity_capital_decision_desc:0 "通过授予决议生成的新角色，会采用当前首都伯爵领的文化和信仰。如需采用其他地区的文化与信仰，请先迁都。"
 avm_spawn_identity_capital_decision_tooltip:0 "一切依照首都的习俗。"
 revoke_tribal_gov_titles_decision:0 "剥夺部落统治者的全部头衔"
 revoke_tribal_gov_titles_decision_desc:0 "剥夺部落制角色持有的全部非名义头衔。跳过受保护角色。"
 revoke_tribal_gov_titles_decision_tooltip:0 "永远告别长屋吧。"
 revoke_clan_gov_titles_decision:0 "剥夺氏族统治者的全部头衔"
 revoke_clan_gov_titles_decision_desc:0 "剥夺氏族制角色持有的全部非名义头衔。跳过受保护角色。"
 revoke_clan_gov_titles_decision_tooltip:0 "家族之业，就此解散。"
 revoke_admin_gov_titles_decision:0 "剥夺行政制统治者的全部头衔"
 revoke_admin_gov_titles_decision_desc:0 "剥夺行政制角色持有的全部非名义头衔；受保护角色不受影响。请注意，本模组的其他功能不支持行政制领国。"
 revoke_admin_gov_titles_decision_tooltip:0 "公文到此为止。"
 revoke_othergov_titles_decision:0 "剥夺非封建统治者的全部头衔"
 revoke_othergov_titles_decision_desc:0 "剥夺所有非封建制角色持有的非名义头衔，不论其采用何种其他政体；受保护角色不受影响。"
 revoke_othergov_titles_decision_tooltip:0 "只留一种制度：我的制度。"
 revoke_nondejure_titles_decision:0 "剥夺法理疆域外的头衔"
 revoke_nondejure_titles_decision_desc:0 "逐一剥夺封臣在其主头衔法理范围之外持有的头衔。例如，西西里公爵会失去位于阿普利亚的地产，但保留西西里。主头衔不会被剥夺，因此不会有人因此失去全部领地；受保护角色不受影响。"
 revoke_nondejure_titles_decision_tooltip:0 "各守自己的疆界。"
 grant_dejure_to_vassals_decision:0 "向封臣归并法理领地"
 grant_dejure_to_vassals_decision_desc:0 "将你亲自持有、且位于公爵及以上封臣主头衔法理范围内的伯爵领授予相应封臣。绝不授予首都伯爵领，也不会影响其他封臣持有的领地；受保护角色不受影响。"
 grant_dejure_to_vassals_decision_tooltip:0 "疆界分明，封臣安宁。"
 avm_set_target_region_decision:0 "设定目标区域"
 avm_set_target_region_decision_desc:0 "记录当前首都所属的法理王国和法理帝国。之后两项区域剥夺决议只会在该目标区域内生效。若要更换目标，请先迁都，再重新设定区域。"
 avm_set_target_region_decision_tooltip:0 "暂且选定这片疆域。"
 avm_clear_target_region_decision:0 "清除目标区域"
 avm_clear_target_region_decision_desc:0 "清除已记录的目标区域。重新设定区域前，两项区域剥夺决议将不会显示。"
 avm_clear_target_region_decision_tooltip:0 "此事作罢。"
 revoke_in_target_kingdom_decision:0 "剥夺目标王国内的全部头衔"
 revoke_in_target_kingdom_decision_desc:0 "剥夺“设定目标区域”所记录的法理王国内所有非名义头衔。区域外的封臣保留其头衔；受保护角色不受影响。"
 revoke_in_target_kingdom_decision_tooltip:0 "仅限此王国，其余人尽可安枕。"
 revoke_in_target_empire_decision:0 "剥夺目标帝国内的全部头衔"
 revoke_in_target_empire_decision_desc:0 "剥夺“设定目标区域”所记录的法理帝国内所有非名义头衔。区域外的封臣保留其头衔；受保护角色不受影响。"
 revoke_in_target_empire_decision_tooltip:0 "仅限此帝国，其余人尽可安枕。"
 avm_domain_warning_tt:0 "操作后的直辖上限余量：[GetPlayer.MakeScope.ScriptValue('avm_domain_headroom')|0]"
 avm_vassal_limit_warning_tt:0 "封臣上限余量：[GetPlayer.MakeScope.ScriptValue('avm_vassal_headroom')|0]"
 avm_count_all_tt:0 "将剥夺[GetPlayer.MakeScope.ScriptValue('avm_count_all_titles')|0]个头衔"
 avm_count_infidel_tt:0 "将剥夺[GetPlayer.MakeScope.ScriptValue('avm_count_infidel_titles')|0]个头衔"
 avm_count_barbarian_tt:0 "将剥夺[GetPlayer.MakeScope.ScriptValue('avm_count_barbarian_titles')|0]个头衔"
 avm_protect_dynasty_decision:0 "保护所有宗族成员"
 avm_protect_dynasty_decision_desc:0 "将所有属于你宗族的封臣设为受保护，使其不受本模组任何大规模操作影响。"
 avm_protect_dynasty_decision_tooltip:0 "血脉为先。"
 avm_protect_council_decision:0 "保护所有内阁成员"
 avm_protect_council_decision_desc:0 "将所有内阁成员设为受保护，使其不受本模组任何大规模操作影响。"
 avm_protect_council_decision_tooltip:0 "我仍需要他们的谏言。"
 avm_clear_all_protection_decision:0 "清除所有保护"
 avm_clear_all_protection_decision_desc:0 "取消领国与宫廷中所有角色的保护，使其再次受到大规模操作影响。"
 avm_clear_all_protection_decision_tooltip:0 "无人可以例外。"
 avm_grant_down_to_domain_limit_decision:0 "授出领地至直辖上限"
 avm_grant_down_to_domain_limit_decision_desc:0 "逐一授出伯爵领，直到你的直辖领地数量不再超过上限，而非一次授出全部领地。绝不授予首都伯爵领。未超过上限时，此决议不可用。"
 avm_grant_down_to_domain_limit_decision_tooltip:0 "适可而止，不多分一寸。"
 avm_prefer_courtiers_decision:0 "新持有者：优先任用廷臣"
 avm_prefer_courtiers_decision_desc:0 "授予决议将优先寻找合适的成年廷臣，再考虑生成新角色。跳过内阁成员、囚犯及受保护角色。此为默认设置，可减小存档体积。"
 avm_prefer_courtiers_decision_tooltip:0 "宫廷中本就不乏贤才。"
 avm_prefer_new_characters_decision:0 "新持有者：始终生成新角色"
 avm_prefer_new_characters_decision_desc:0 "授予决议始终生成新角色，不会任用现有廷臣。长期使用会使存档中增加大量生成的角色。"
 avm_prefer_new_characters_decision_tooltip:0 "另寻新人前来。"
 avm_contracts_max_tax_decision:0 "将所有封臣契约赋税调至最高"
 avm_contracts_max_tax_decision_desc:0 "将所有封建制直属封臣的赋税义务调至最高，无视原版的君权要求。此举会招致显著的好感惩罚。跳过受保护角色。\n\n仅封建制封臣的赋税等级可以调整。部落制、神权制、共和制及牧民契约均只有一个固定等级；氏族制与行政制封臣则使用完全不同的制度，因此均不受影响。"
 avm_contracts_max_tax_decision_tooltip:0 "国库尚有诸多开支。"
 avm_contracts_max_levies_decision:0 "将所有封臣契约征召兵调至最高"
 avm_contracts_max_levies_decision_desc:0 "将所有封建制直属封臣的征召兵义务调至最高，无视原版的君权要求。此举会招致显著的好感惩罚。跳过受保护角色。\n\n仅封建制封臣的征召兵等级可以调整，其他政体不受影响。"
 avm_contracts_max_levies_decision_tooltip:0 "征集一切可用之兵。"
 avm_count_feudal_contracts_tt:0 "影响[GetPlayer.MakeScope.ScriptValue('avm_count_feudal_contract_vassals')|0]位未受保护的封建制封臣；另有[GetPlayer.MakeScope.ScriptValue('avm_count_other_contract_vassals')|0]位未受保护的非封建制封臣没有可调整的契约，因此不受影响"
 avm_contracts_reset_decision:0 "将所有封臣契约恢复常规"
 avm_contracts_reset_decision_desc:0 "将所有封建制直属封臣的赋税与征召兵义务恢复为契约初始等级，可撤销此前批量提高赋税或征召兵义务的操作。原版契约界面不允许将义务降至君权允许范围以下，因此无法在那里撤销这类调整；受保护角色不受影响。"
 avm_contracts_reset_decision_tooltip:0 "恢复旧日约定。"
 avm_contracts_by_loyalty_decision:0 "按封臣好感调整赋税"
 avm_contracts_by_loyalty_decision_desc:0 "根据每位封建制直属封臣对你的好感，一次性调整其赋税义务：\n\n#weak 好感不低于50#!：苛索\n#weak 好感为0至49#!：高额\n#weak 好感为-1至-25#!：常规\n#weak 好感低于-25#!：低额\n\n对好感较高的封臣提高赋税，对濒临反叛的封臣降低赋税，避免一味加税引发派系。不会调整征召兵义务；受保护角色不受影响。"
 avm_contracts_by_loyalty_decision_tooltip:0 "各取其所能承受。"
 avm_loyalty_report_decision:0 "领国封臣态度报告"
 avm_loyalty_report_decision_desc:0 "汇总直属封臣对你的好感分布；以下统计不包括受保护的封臣。执行本决议不会改变游戏状态。\n\n#weak 忠诚（好感不低于50）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_devoted')|0]\n#weak 满意（好感0至49）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_content')|0]\n#weak 不满（好感-1至-25）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_wavering')|0]\n#weak 敌对（好感低于-25）：#![GetPlayer.MakeScope.ScriptValue('avm_count_vassals_hostile')|0]\n\n#high 不满的强力封臣：[GetPlayer.MakeScope.ScriptValue('avm_count_powerful_hostile')|0]#!\n这些封臣拥有足以付诸行动的军力。\n\n#weak 当前受保护的封臣：#![GetPlayer.MakeScope.ScriptValue('avm_count_protected')|0]\n#weak 可调整契约的封建制封臣：#![GetPlayer.MakeScope.ScriptValue('avm_count_feudal_contract_vassals')|0]"
 avm_loyalty_report_decision_tooltip:0 "封臣对我究竟是什么态度？"
 avm_loyalty_report_effect_tt:0 "不会改变任何状态，仅显示报告。"
 avm_protect_powerful_decision:0 "保护所有强力封臣"
 avm_protect_powerful_decision_desc:0 "将所有强力封臣设为受保护，使本模组的所有大规模操作都跳过他们。建议在解锁大规模头衔剥夺前执行，以免剥夺强力封臣的头衔并引发意料之外的战争。"
 avm_protect_powerful_decision_tooltip:0 "这些人暂且不动。"
 avm_protect_content_decision:0 "保护所有满意的封臣"
 avm_protect_content_decision_desc:0 "将所有对你好感不低于0的封臣设为受保护。此决议可与“剥夺不忠封臣的全部头衔”配合使用：先执行本决议，再进行头衔剥夺，即可避免影响对你满意的封臣。"
 avm_protect_content_decision_tooltip:0 "善待恪尽本分之人。"
