 grant_duchies_decision_tooltip:0 "别让农民来烦我。"
 grant_kingdoms_decision:0 "授予王国"
 grant_kingdoms_decision_desc:0 "将王国随机授予其法理疆域内的公爵，主王国除外。"
 grant_kingdoms_decision_tooltip:0 "莫要背叛于我。"
 grant_duchies_to_dynasty_decision:0 "向宗族成员授予公爵领"
 grant_duchies_to_dynasty_decision_desc:0 "将公爵领及其法理伯爵领授予尚无公爵领的宗族成员。若其中的法理伯爵领已有封臣，则一并转封。"
 grant_duchies_to_dynasty_decision_tooltip:0 "或许这确实是任人唯亲。"
 convert_subjects_faith_decision:0 "改变臣民信仰"
 convert_subjects_faith_decision_desc:0 "使所有臣民皈依你的信仰。"
 convert_subjects_faith_decision_tooltip:0 "奉行你们君主的信仰！"
 depose_abdicate_decision:0 "退位让贤"
