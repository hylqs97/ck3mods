l_simp_chinese:
 acm_diag_check_setup_0:0 "配置有效"
 acm_diag_check_setup_default:0 "配置未初始化或版本不匹配；先打开自动教育设置"
 acm_diag_check_age_0:0 "符合0至15岁范围"
 acm_diag_check_age_default:0 "不在0至15岁范围"
 acm_diag_check_ai_0:0 "健在的非玩家儿童"
 acm_diag_check_ai_default:0 "已死亡、成年或由玩家控制"
 acm_diag_check_excluded_0:0 "未排除"
 acm_diag_check_excluded_default:0 "已被排除；请用角色互动恢复自动教育"
 acm_diag_check_guardian_0:0 "尚无监护人"
 acm_diag_check_guardian_default:0 "已有监护人；原 Mod 不会替换"
 acm_diag_check_available_0:0 "可接受监护"
 acm_diag_check_available_default:0 "旅行、被囚禁、人质、无能或正前往监护人处"
 acm_diag_check_permission_0:0 "有权限"
 acm_diag_check_permission_default:0 "未通过原 Mod 的监护安排权限检查"
 acm_diag_check_subject_0:0 "未满4岁，或已有教育重心或适用的童年特质"
 acm_diag_check_subject_default:0 "缺少教育重心和适用的童年特质"
 acm_diag_check_recent_0:0 "无近期分配标记"
 acm_diag_check_recent_default:0 "已有近期分配标记，暂时跳过"
 acm_diag_check_postponed_0:0 "未推迟"
 acm_diag_check_postponed_default:0 "已推迟；后台跳过，手动立即检查可忽略此标记"
 acm_diag_check_policy_0:0 "至少一项匹配政策启用了监护"
 acm_diag_check_policy_default:0 "没有匹配且启用监护的政策"
 acm_diag_check_self_0:0 "符合原 Mod 的玩家资格检查（仅事件模式使用）"
 acm_diag_check_self_default:0 "不符合；需成年、健在、未被囚禁、非无能，且被监护人少于2人"
 acm_diag_overview_desc:0 "[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]的监护诊断。以下读取当前实际设置。\n\n设置：[ROOT.Char.Custom('acm_diag_check_setup')]\n年龄：[ROOT.Char.Custom('acm_diag_check_age')]\n角色：[ROOT.Char.Custom('acm_diag_check_ai')]\n单独排除：[ROOT.Char.Custom('acm_diag_check_excluded')]\n现有监护人：[ROOT.Char.Custom('acm_diag_check_guardian')]\n可用状态：[ROOT.Char.Custom('acm_diag_check_available')]\n安排权限：[ROOT.Char.Custom('acm_diag_check_permission')]\n教育条件：[ROOT.Char.Custom('acm_diag_check_subject')]\n近期分配：[ROOT.Char.Custom('acm_diag_check_recent')]\n推迟状态：[ROOT.Char.Custom('acm_diag_check_postponed')]\n政策范围：[ROOT.Char.Custom('acm_diag_check_policy')]\n亲自监护：[ROOT.Char.Custom('acm_diag_check_self')]\n\n下方只列出此儿童所属的政策；依原 Mod 的优先级排列。进入政策查看候选人筛选结果。"
 acm_diag_overview_title:0 "自动教育：未分配监护人的原因"
 acm_diag_open:0 "查看监护诊断"
 acm_diag_close:0 "关闭诊断"
 acm_diag_back:0 "返回诊断总览"
 acm_diag_details:0 "查看候选人排除原因"
 acm_diag_policy_back:0 "返回政策诊断"
 acm_diag_refresh:0 "重新读取此政策"
 acm_diag_interaction:0 "诊断自动监护"
 acm_diag_interaction_desc:0 "检查此儿童的自动监护条件、政策、候选人筛选结果及玩家亲自监护资格。此操作只诊断，不安排婚姻、教育或监护。"
 acm_diag_policy_name_0:0 "1. 第一继承人"
 acm_diag_policy_name_1:0 "2. 统治者的子女"
 acm_diag_policy_name_2:0 "3. 孙辈与曾孙辈"
 acm_diag_policy_name_3:0 "4. 近亲的子女"
 acm_diag_policy_name_4:0 "5. 近亲及远亲的子女"
 acm_diag_policy_name_5:0 "6. 家族子嗣"
 acm_diag_policy_name_6:0 "7. 宗族子嗣"
 acm_diag_policy_name_7:0 "8. 宫廷中的孩童"
 acm_diag_policy_name_default:0 "未选择政策"
 acm_diag_mode_0:0 "禁用"
 acm_diag_mode_1:0 "事件（允许选择玩家亲自监护）"
 acm_diag_mode_2:0 "自动（只安排AI监护人，不选择玩家）"
 acm_diag_mode_default:0 "未初始化"
 acm_diag_enabled_0:0 "已启用"
 acm_diag_enabled_default:0 "已禁用"
 acm_diag_result_0:0 "设置未初始化或版本不兼容，请先打开原 Mod 设置。"
 acm_diag_result_1:0 "本政策未启用，不会安排监护。"
 acm_diag_result_2:0 "本政策的监护指派已禁用。"
 acm_diag_result_3:0 "儿童未通过当前扫描条件。请返回总览查看具体项目；手动立即检查可忽略推迟标记。"
 acm_diag_result_4:0 "事件模式下你可亲自监护；即使AI候选人为0，也应有亲自监护选项。"
 acm_diag_result_5:0 "存在符合条件的AI监护人。若尚未分配，检查是否有更高优先级政策或教育事件正在处理；此诊断不执行分配。"
 acm_diag_result_6:0 "所选搜索范围内没有可纳入的AI成年候选人。勾选家族成员也不会将玩家纳入自动候选人。"
 acm_diag_result_7:0 "候选人全部未通过基本可用条件；查看排除原因。"
 acm_diag_result_default:0 "基本条件合格的候选人全部被政策要求排除；查看年龄、信仰、文化等排除原因。"
 acm_diag_policy_title:0 "[ROOT.Char.Custom('acm_diag_policy_name')]：监护筛选"
 acm_diag_policy_desc:0 "儿童：[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]\n政策：[ROOT.Char.Custom('acm_diag_policy_name')]\n状态：[ROOT.Char.Custom('acm_diag_enabled')]\n实际模式：[ROOT.Char.Custom('acm_diag_mode')]\n\n搜索范围内AI成年候选人：[ROOT.Var('acm_diag_raw').GetValue|0]\n通过基本条件：[ROOT.Var('acm_diag_base').GetValue|0]\n通过全部政策要求：[ROOT.Var('acm_diag_pass').GetValue|0]\n\n[ROOT.Char.Custom('acm_diag_result')]\n\n候选人数字不含玩家本人。诊断不会改变监护关系或原 Mod 的政策。"
 acm_diag_reject_title:0 "监护候选人：排除原因"
 acm_diag_reject_desc:0 "儿童：[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]\n政策：[ROOT.Char.Custom('acm_diag_policy_name')]\n以下为各条件独立排除的人数，同一候选人可能重复计入：\n\n已有至少2名被监护人：[ROOT.Var('acm_diag_reject_capacity').GetValue|0]\n身体或基本状态不允许：[ROOT.Var('acm_diag_reject_physical').GetValue|0]\n关系、意愿或可用权限不符：[ROOT.Var('acm_diag_reject_permission').GetValue|0]\n年龄要求：[ROOT.Var('acm_diag_reject_age').GetValue|0]\n性别要求：[ROOT.Var('acm_diag_reject_gender').GetValue|0]\n信仰要求：[ROOT.Var('acm_diag_reject_faith').GetValue|0]\n文化要求：[ROOT.Var('acm_diag_reject_culture').GetValue|0]\n巫师要求：[ROOT.Var('acm_diag_reject_witch').GetValue|0]\n\n年龄、信仰、文化等数字依据当前政策的强制要求计算；“偏好”不作为排除条件。权限项目包括被囚禁、人质、无能、监护旅行、已有提议、仇敌、战争及关系限制。"
