l_simp_chinese:
 acm_diag_check_setup_0:0 "设置有效"
 acm_diag_check_setup_default:0 "设置尚未初始化，或与当前版本不兼容；请先打开自动教育 Mod 的设置。"
 acm_diag_check_age_0:0 "年龄在0至15岁之间"
 acm_diag_check_age_default:0 "年龄不在0至15岁范围内"
 acm_diag_check_ai_0:0 "仍在世、未成年且由AI控制的儿童"
 acm_diag_check_ai_default:0 "已死亡、已成年，或由玩家控制"
 acm_diag_check_excluded_0:0 "未被排除"
 acm_diag_check_excluded_default:0 "此角色已从自动教育中排除；可通过角色互动恢复自动教育。"
 acm_diag_check_guardian_0:0 "尚未指定监护人"
 acm_diag_check_guardian_default:0 "已有监护人；原 Mod 不会自动更换"
 acm_diag_check_available_0:0 "当前可以接受监护安排"
 acm_diag_check_available_default:0 "被囚禁、作为人质、正在旅行、身体状况不允许，或正在前往监护人处"
 acm_diag_check_permission_0:0 "具备监护安排资格"
 acm_diag_check_permission_default:0 "未通过原 Mod 的监护安排权限检查"
 acm_diag_check_subject_0:0 "未满4岁，或已设置教育重心，或拥有适用的童年特质"
 acm_diag_check_subject_default:0 "尚未设置教育重心，也没有适用的童年特质"
 acm_diag_check_recent_0:0 "近期未分配过监护人"
 acm_diag_check_recent_default:0 "近期已分配过监护人，系统会暂时跳过"
 acm_diag_check_postponed_0:0 "未被推迟处理"
 acm_diag_check_postponed_default:0 "已被推迟处理；后台扫描会跳过，手动立即检查可忽略此标记"
 acm_diag_check_policy_0:0 "至少有一项适用政策已启用监护安排"
 acm_diag_check_policy_default:0 "没有适用于该儿童且已启用监护安排的政策"
 acm_diag_check_self_0:0 "符合原 Mod 的玩家监护资格（仅限事件模式）"
 acm_diag_check_self_default:0 "不符合玩家监护条件；必须成年、在世、身体状况允许，且现有被监护人数少于2人"
 acm_diag_overview_desc:0 "正在诊断[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]的监护安排。以下内容反映当前实际设置。\n\n设置状态：[ROOT.Char.Custom('acm_diag_check_setup')]\n年龄条件：[ROOT.Char.Custom('acm_diag_check_age')]\n角色状态：[ROOT.Char.Custom('acm_diag_check_ai')]\n排除状态：[ROOT.Char.Custom('acm_diag_check_excluded')]\n现有监护人：[ROOT.Char.Custom('acm_diag_check_guardian')]\n儿童当前状态：[ROOT.Char.Custom('acm_diag_check_available')]\n监护安排权限：[ROOT.Char.Custom('acm_diag_check_permission')]\n教育条件：[ROOT.Char.Custom('acm_diag_check_subject')]\n近期分配状态：[ROOT.Char.Custom('acm_diag_check_recent')]\n推迟处理状态：[ROOT.Char.Custom('acm_diag_check_postponed')]\n适用政策：[ROOT.Char.Custom('acm_diag_check_policy')]\n玩家亲自监护：[ROOT.Char.Custom('acm_diag_check_self')]\n\n下方列出适用于该儿童的政策，并按原 Mod 的优先级排列。选择一项即可查看监护候选人的筛选结果。"
 acm_diag_overview_title:0 "自动教育：为何没有分配监护人？"
 acm_diag_open:0 "查看监护诊断"
 acm_diag_close:0 "关闭诊断"
 acm_diag_back:0 "返回诊断总览"
 acm_diag_details:0 "查看候选人排除原因"
 acm_diag_policy_back:0 "返回政策诊断"
 acm_diag_refresh:0 "重新读取这项政策"
 acm_diag_interaction:0 "诊断自动监护"
 acm_diag_interaction_desc:0 "查看此儿童是否符合自动监护条件、适用哪些政策、候选人被筛除的原因，以及玩家能否亲自担任监护人。此互动仅提供诊断信息，不会更改婚姻、教育重心或监护关系。"
 acm_diag_policy_name_0:0 "1. 第一继承人"
 acm_diag_policy_name_1:0 "2. 统治者的子女"
 acm_diag_policy_name_2:0 "3. 统治者的孙辈与曾孙辈"
 acm_diag_policy_name_3:0 "4. 近亲的子女"
 acm_diag_policy_name_4:0 "5. 近亲及远亲的子女"
 acm_diag_policy_name_5:0 "6. 家族成员的子女"
 acm_diag_policy_name_6:0 "7. 宗族成员的子女"
 acm_diag_policy_name_7:0 "8. 宫廷中的儿童"
 acm_diag_policy_name_default:0 "未选择政策"
 acm_diag_mode_0:0 "禁用"
 acm_diag_mode_1:0 "事件模式（可选择玩家担任监护人）"
 acm_diag_mode_2:0 "自动模式（只安排AI角色担任监护人）"
 acm_diag_mode_default:0 "未初始化"
 acm_diag_enabled_0:0 "已启用"
 acm_diag_enabled_default:0 "未启用"
 acm_diag_result_0:0 "设置尚未初始化，或与当前版本不兼容；请先打开原 Mod 设置。"
 acm_diag_result_1:0 "这项政策未启用，因此不会安排监护人。"
 acm_diag_result_2:0 "这项政策的监护人安排功能已关闭。"
 acm_diag_result_3:0 "儿童未通过自动监护扫描条件。请返回总览查看未通过的项目；手动立即检查可忽略推迟标记。"
 acm_diag_result_4:0 "当前为事件模式，且你符合亲自担任监护人的条件。即使没有AI候选人，也应能选择你自己。"
 acm_diag_result_5:0 "已找到符合条件的AI监护人。若儿童尚未分配监护人，可能是更高优先级的政策或教育事件正在处理。此诊断不会实际分配监护人。"
 acm_diag_result_6:0 "所选搜索范围内没有符合条件的AI成年候选人。即使将家族成员纳入搜索范围，玩家角色也不会成为自动监护人候选人。"
 acm_diag_result_7:0 "所有候选人都未通过基本条件；请查看具体排除原因。"
 acm_diag_result_default:0 "有候选人通过基本条件，但没有人满足这项政策的全部筛选要求；请查看年龄、性别、信仰、文化等排除原因。"
 acm_diag_policy_title:0 "[ROOT.Char.Custom('acm_diag_policy_name')]：监护筛选"
 acm_diag_policy_desc:0 "儿童：[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]\n政策：[ROOT.Char.Custom('acm_diag_policy_name')]\n状态：[ROOT.Char.Custom('acm_diag_enabled')]\n监护模式：[ROOT.Char.Custom('acm_diag_mode')]\n\n搜索范围内的AI成年候选人：[ROOT.Var('acm_diag_raw').GetValue|0]\n通过基本条件：[ROOT.Var('acm_diag_base').GetValue|0]\n通过该政策全部筛选：[ROOT.Var('acm_diag_pass').GetValue|0]\n\n[ROOT.Char.Custom('acm_diag_result')]\n\n以上候选人数不包括玩家角色。此诊断不会改变监护关系或原 Mod 的政策设置。"
 acm_diag_reject_title:0 "监护候选人：排除原因"
 acm_diag_reject_desc:0 "儿童：[ROOT.Var('acm_diag_child').Char.GetShortUINameNoTooltip]\n政策：[ROOT.Char.Custom('acm_diag_policy_name')]\n以下各项分别统计被排除的候选人数；同一候选人可能被多项条件重复计数：\n\n监护人数已达上限（至少2名被监护人）：[ROOT.Var('acm_diag_reject_capacity').GetValue|0]\n身体条件不符合：[ROOT.Var('acm_diag_reject_physical').GetValue|0]\n监护安排资格不符：[ROOT.Var('acm_diag_reject_permission').GetValue|0]\n年龄要求不符：[ROOT.Var('acm_diag_reject_age').GetValue|0]\n性别要求不符：[ROOT.Var('acm_diag_reject_gender').GetValue|0]\n信仰要求不符：[ROOT.Var('acm_diag_reject_faith').GetValue|0]\n文化要求不符：[ROOT.Var('acm_diag_reject_culture').GetValue|0]\n巫师条件不符：[ROOT.Var('acm_diag_reject_witch').GetValue|0]\n\n年龄、信仰、文化等统计只反映政策中的强制要求；“偏好”不会单独排除候选人。其他监护人筛选条件还包括：是否被囚禁或扣作人质、身体状况是否适合担任监护人、是否正在前往被监护人处、是否已被提议担任监护人、是否与统治者为仇敌或宿敌、是否与统治者交战，以及是否符合关系或好感要求。"
 acm_diag_policy_0:0 "1. 第一继承人"
 acm_diag_policy_1:0 "2. 统治者的子女"
