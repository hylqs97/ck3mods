 acm_diag_choose_children:0 "选择我的子女并诊断"
 acm_diag_picker_title:0 "选择需要检查的子女"
 acm_diag_picker_desc:0 "这里列出你的健在未成年子女，不受原 Mod 的年龄、监护人或政策条件限制。选择一个孩子，查看其被跳过的实际原因。\n\n如果没有姓名按钮，表示没有找到健在的未成年子女。也可以右键其他儿童，选择“诊断自动监护”。"
 acm_diag_next:0 "下一页子女"
 acm_diag_scan_empty_title:0 "本次未产生教育安排"
 acm_diag_scan_empty_desc:0 "这不代表你没有孩子。原检查可能因年龄、现有监护人、政策或教育条件跳过儿童。\n\n点击“选择我的子女并诊断”，直接查看每个孩子的实际条件与候选人筛选结果。"
 autoedu.3900.desc:0 "本次检查未产生可执行的教育安排。这不一定表示没有孩子：儿童可能已有监护人、被排除、未达到年龄、缺少教育条件，或没有匹配且启用的政策。\n\n右键点击需要检查的儿童，选择“诊断自动监护”，可查看其当前条件与各政策的候选人筛选结果。"
 acm_diag_context_missing:0 "无法读取本次诊断对象；请关闭窗口并重新右键儿童发起诊断"
