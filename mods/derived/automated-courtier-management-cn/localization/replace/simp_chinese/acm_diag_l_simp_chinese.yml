 acm_diag_pick_6:0 "查看[ROOT.Var('acm_diag_slot_6').Char.GetShortUINameNoTooltip]的诊断"
 acm_diag_pick_7:0 "查看[ROOT.Var('acm_diag_slot_7').Char.GetShortUINameNoTooltip]的诊断"
 acm_diag_choose_children:0 "选择子女进行诊断"
 acm_diag_picker_title:0 "选择要诊断的子女"
 acm_diag_picker_desc:0 "此处列出你所有仍在世的未成年子女，不受原 Mod 的年龄、监护人和政策筛选条件限制。选择一名子女即可查看系统跳过其自动监护安排的原因。\n\n若没有显示姓名按钮，说明未找到仍在世的未成年子女。你也可以右键点击其他儿童，选择“诊断自动监护”。"
 acm_diag_next:0 "下一页"
 acm_diag_scan_empty_title:0 "本次扫描未安排监护人"
 acm_diag_scan_empty_desc:0 "这不代表你没有子女。扫描可能因年龄、已有监护人、排除设置、政策或教育条件而跳过他们。\n\n点击“选择子女进行诊断”，即可查看每名子女的检查结果和候选人筛选情况。"
 autoedu.3900.desc:0 "本次扫描没有可执行的教育安排。这不一定表示你没有子女：儿童可能已有监护人、已被排除、年龄不符、缺少教育条件，或没有适用且已启用的政策。\n\n右键点击要检查的儿童，选择“诊断自动监护”，即可查看其当前条件及各项政策下的监护人筛选结果。"
 acm_diag_context_missing:0 "无法读取本次诊断的儿童。请关闭此窗口，再右键点击儿童并选择“诊断自动监护”。"
