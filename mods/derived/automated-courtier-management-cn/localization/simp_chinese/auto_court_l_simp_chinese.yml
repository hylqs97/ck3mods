l_simp_chinese:

 # 决议
 auto_court_settings_decision_title:0 "廷臣自动管理：设置"
 auto_court_settings_decision_desc:0 "设置每年自动评估宫廷廷臣的规则，包括留任标准、驱逐条件、婚姻安排和角色保护。"
 auto_court_settings_decision_tooltip:0 "打开廷臣自动管理面板，配置评估标准、婚姻规则和保护对象。"
 auto_court_settings_decision_confirm_text:0 "打开面板"

 # 角色互动
 auto_court_protect_courtier_interaction:0 "将角色豁免于自动管理"
 auto_court_protect_courtier_interaction_desc:0 "将[recipient.GetShortUINameNoTooltip]排除在廷臣自动管理之外。自动管理不会#G 驱逐#!该角色，也不会为其安排婚姻。"
 auto_court_protect_courtier_interaction_outcome:0 "该角色已获豁免，不会被自动驱逐或安排婚姻。"
 auto_court_unprotect_courtier_interaction:0 "恢复廷臣自动管理"
 auto_court_unprotect_courtier_interaction_desc:0 "取消[recipient.GetShortUINameNoTooltip]的自动管理豁免。此后会依照你的领地规则重新评估该角色，并可为其安排婚姻。"
 auto_court_unprotect_courtier_interaction_outcome:0 "该角色将重新纳入廷臣自动管理。"

 auto_court_run_now_decision_title:0 "立即管理廷臣"
 auto_court_run_now_decision_desc:0 "立即评估宫廷中的所有廷臣，驱逐不符合留任标准者，并为符合条件的未婚廷臣安排婚姻。"
 auto_court_run_now_decision_tooltip:0 "立即执行廷臣评估和婚姻安排。"
 auto_court_run_now_decision_confirm_text:0 "立即管理"

 auto_court_debug_populate_decision_title:0 "（调试）生成测试廷臣"
 auto_court_debug_populate_decision_desc:0 "立即在你的宫廷中生成7名测试廷臣，包括低能力值、高能力值、情人、朋友和天才等不同类型，用于测试自动管理系统。"
 auto_court_debug_populate_decision_tooltip:0 "生成一组具有不同特质、能力值和人际关系的测试廷臣。"
 auto_court_debug_populate_decision_confirm_text:0 "生成廷臣"
 auto_court_debug_setup_master_admin_decision_title:0 "（调试）任命高能力管理者"
 auto_court_debug_setup_master_admin_decision_desc:0 "立即任命一名相关能力值至少为20的管理者（总管、掌玺大臣或次官），并启用管理者能力影响模式。"
 auto_court_debug_setup_master_admin_decision_tooltip:0 "测试高能力管理者影响下的婚姻匹配效果与廷臣驱逐评估。"
 auto_court_debug_setup_master_admin_decision_confirm_text:0 "任命管理者"
 auto_court_debug_setup_incompetent_admin_decision_title:0 "（调试）任命低能力管理者"
 auto_court_debug_setup_incompetent_admin_decision_desc:0 "立即任命一名相关能力值为2的管理者（总管、掌玺大臣或次官），并启用管理者能力影响模式。"
 auto_court_debug_setup_incompetent_admin_decision_tooltip:0 "测试低能力管理者造成的管理疏漏，以及常规婚姻匹配效果。"
 auto_court_debug_setup_incompetent_admin_decision_confirm_text:0 "任命管理者"

 # 通知与报告
 auto_court_yearly_report_toast_title:0 "廷臣管理完成"
 auto_court_yearly_report_toast_desc:0 "廷臣评估报告：\n• 已驱逐：[TopScope.GetValue('auto_court_dismissed_val')|0]\n• 已安排婚姻：[TopScope.GetValue('auto_court_married_val')|0]\n• 优秀配偶：[TopScope.GetValue('auto_court_bonus_val')|0]\n• 因评估疏漏而留任：[TopScope.GetValue('auto_court_oversight_val')|0]"
 auto_court_debug_spawn_toast_title:0 "测试廷臣已生成"
 auto_court_debug_spawn_toast_desc:0 "7名各具特点的测试廷臣已加入你的宫廷，包括低能力值、高能力值、情人、朋友和天才等类型。"
 auto_court_debug_master_admin_toast_title:0 "高能力管理者已任命"
 auto_court_debug_master_admin_toast_desc:0 "一名相关能力值至少为20的高能力管理者已在你的宫廷任职。管理者能力影响模式现已启用。"
 auto_court_debug_incompetent_admin_toast_title:0 "低能力管理者已任命"
 auto_court_debug_incompetent_admin_toast_desc:0 "一名相关能力值为2的低能力管理者已在你的宫廷任职。管理者能力影响模式现已启用，管理疏漏的风险较高。"

 # 游戏规则
 rule_auto_court_rule_status:0 "廷臣自动管理"
 rule_auto_court_rule_status_desc:0 "决定是否默认为玩家统治者启用每年一次的廷臣自动管理。"
 setting_auto_court_rule_status_enabled:0 "启用"
 setting_auto_court_rule_status_enabled_desc:0 "每年自动管理一次廷臣。"
 setting_auto_court_rule_status_disabled:0 "禁用"
 setting_auto_court_rule_status_disabled_desc:0 "默认关闭；需通过决议手动启用廷臣自动管理。"
 rule_auto_court_rule_aptitude:0 "廷臣自动管理：管理者能力影响"
 rule_auto_court_rule_aptitude_desc:0 "决定廷臣评估是否严格遵循既定规则，或受管理者能力影响。启用能力影响后，有地统治者的掌玺大臣或总管、无地冒险者的次官会影响配偶质量，并带来少量管理疏漏的风险。"
 setting_auto_court_rule_aptitude_strict:0 "严格执行（默认）"
 setting_auto_court_rule_aptitude_strict_desc:0 "评估严格遵循你设定的规则，不受管理者能力影响。"
 setting_auto_court_rule_aptitude_influenced:0 "受管理者能力影响"
 setting_auto_court_rule_aptitude_influenced_desc:0 "管理者的能力会影响所安排配偶的质量，并可能造成少量管理疏漏。有地统治者由掌玺大臣或总管负责，无地冒险者由次官负责。"

 # 事件0001：管理总览
 auto_court_event.0001.t:0 "廷臣自动管理：领地总览"
 auto_court_event.0001.desc:0 "宫廷事务繁杂，需要妥善管理。你可以在此设置廷臣的留任与驱逐标准、婚姻安排规则，并指定需要保护的角色。\n\n#V 当前设置：#! \n• 自动管理：[Select_CString(ROOT.Var('auto_court_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 自动驱逐：[Select_CString(ROOT.Var('auto_court_dismiss_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 留任能力值门槛：[ROOT.Var('auto_court_min_stat_threshold').GetValue|0]\n• 自动安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 评估模式：[Select_CString(ROOT.Var('auto_court_aptitude_mode').IsSet, '#italic 受管理者能力影响#!', '#high 严格按规则执行#!')]"
 auto_court_event.0001.toggle_status:0 "切换自动管理状态"
 auto_court_event.0001.configure_stats:0 "设置廷臣留任能力值门槛……"
 auto_court_event.0001.configure_marriage:0 "设置婚姻安排规则……"
 auto_court_event.0001.configure_safeguards:0 "设置保护规则与豁免……"
 auto_court_event.0001.configure_aptitude:0 "设置管理者能力影响模式……"
 auto_court_event.0001.run_now:0 "#G 立即运行廷臣评估#!"
 auto_court_event.0001.configuration_menu:0 "更多设置……"
 auto_court_event.0001.debug_spawn:0 "#P （调试：批量生成测试廷臣）#!"
 auto_court_event.0001.close:0 "完成"

 # 事件0002：驱逐设置
 auto_court_event.0002.t:0 "驱逐标准与留任门槛"
 auto_court_event.0002.desc:0 "设置廷臣留在宫廷所需达到的最低能力值。六项能力属性中任意一项达到该门槛即可留任。若只需自动安排婚姻，也可关闭自动驱逐。\n\n#V 当前驱逐状态：#! [Select_CString(ROOT.Var('auto_court_dismiss_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n#V 当前留任门槛：#! [ROOT.Var('auto_court_min_stat_threshold').GetValue|0]"
 auto_court_event.0002.toggle_dismissal:0 "切换自动驱逐状态"
 auto_court_event.0002.threshold_8:0 "宽松：能力值门槛为8"
 auto_court_event.0002.threshold_10:0 "标准：能力值门槛为10（默认）"
 auto_court_event.0002.threshold_12:0 "严格：能力值门槛为12"
 auto_court_event.0002.threshold_15:0 "精英：能力值门槛为15"

 # 事件0003：婚姻设置
 auto_court_event.0003.t:0 "婚姻安排规则"
 auto_court_event.0003.desc:0 "设置自动婚姻安排。启用后，未婚男性廷臣将缔结父系婚姻，妻子会加入你的宫廷；未婚女性廷臣将缔结母系婚姻，丈夫会加入你的宫廷。\n\n#V 当前规则：#! \n• 状态：[Select_CString(ROOT.Var('auto_court_marry_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n • 为第一继承人安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_heir_allowed').IsSet, '#high 允许#!', '#G 仅允许手动安排#!')]\n• 为近亲安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_close_family_allowed').IsSet, '#high 允许#!', '#G 仅允许手动安排#!')]\n• 为宗族成员安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_dynasty_allowed').IsSet, '#high 允许#!', '#G 仅允许手动安排#!')]\n• 为情人与灵魂伴侣安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_lovers_allowed').IsSet, '#high 允许#!', '#G 仅允许手动安排#!')]"
 auto_court_event.0003.toggle_marriage:0 "切换自动婚姻安排状态"
 auto_court_event.0003.toggle_heir:0 "切换第一继承人婚姻保护"
 auto_court_event.0003.toggle_close_family:0 "切换近亲婚姻保护"
 auto_court_event.0003.toggle_dynasty:0 "切换宗族成员婚姻保护"
 auto_court_event.0003.toggle_lovers:0 "切换情人与灵魂伴侣婚姻保护"

 # 事件0004：保护规则
 auto_court_event.0004.t:0 "保护规则与受保护角色"
 auto_court_event.0004.desc:0 "启用保护规则后，指定的重要角色无论能力值高低都不会被驱逐。\n\n• 宗族与亲属：[Select_CString(ROOT.Var('auto_court_safeguard_dynasty_disabled').IsSet, '#N 禁用#!', '#G 受保护#!')]\n• 情人与朋友：[Select_CString(ROOT.Var('auto_court_safeguard_relationships_disabled').IsSet, '#N 禁用#!', '#G 受保护#!')]\n • 宫廷职位任职者及其亲属：[Select_CString(ROOT.Var('auto_court_safeguard_positions_disabled').IsSet, '#N 禁用#!', '#G 受保护#!')]\n• 先天特质：[Select_CString(ROOT.Var('auto_court_safeguard_traits_disabled').IsSet, '#N 禁用#!', '#G 受保护#!')]\n• 已关注角色：[Select_CString(ROOT.Var('auto_court_safeguard_pinned_disabled').IsSet, '#N 禁用#!', '#G 受保护#!')]"
 auto_court_event.0004.toggle_dynasty:0 "切换宗族与亲属保护规则"
 auto_court_event.0004.toggle_relations:0 "切换情人与朋友保护规则"
 auto_court_event.0004.toggle_positions:0 "切换宫廷职位任职者及其亲属保护规则"
 auto_court_event.0004.toggle_traits:0 "切换先天特质保护规则"
 auto_court_event.0004.toggle_pinned:0 "切换已关注角色保护规则"

 # 事件0005：评估模式
 auto_court_event.0005.t:0 "评估模式与管理者能力"
 auto_court_event.0005.desc:0 "选择廷臣评估的执行方式：\n\n• #high 严格按规则执行#!：完全遵循你设定的筛选条件。\n• #italic 受管理者能力影响#!：管理者的能力会影响所安排配偶的质量，例如配偶拥有优秀特质或较高教育特质的概率，并可能造成少量评估疏漏。有地统治者由掌玺大臣或总管担任管理者；无地冒险者由次官担任。\n\n#V 当前模式：#! [Select_CString(ROOT.Var('auto_court_aptitude_mode').IsSet, '#italic 受管理者能力影响#!', '#high 严格按规则执行#!')]"
 auto_court_event.0005.strict_mode:0 "设为严格按规则执行（完全确定）"
 auto_court_event.0005.aptitude_mode:0 "设为管理者能力影响模式"
 auto_court_event.0005.debug_master:0 "#P （调试：任命高能力管理者）#!"
 auto_court_event.0005.debug_incompetent:0 "#N （调试：任命低能力管理者）#!"

 # 事件0006：配置菜单
 auto_court_event.0006.t:0 "廷臣自动管理：配置与规则"
 auto_court_event.0006.desc:0 "调整宫廷管理规则。选择下方类别，设置廷臣留任门槛、婚姻安排、角色保护规则或管理者能力影响模式。\n\n#V 当前设置：#! \n• 自动管理：[Select_CString(ROOT.Var('auto_court_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 自动驱逐：[Select_CString(ROOT.Var('auto_court_dismiss_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 留任能力值门槛：[ROOT.Var('auto_court_min_stat_threshold').GetValue|0]\n• 自动安排婚姻：[Select_CString(ROOT.Var('auto_court_marry_disabled').IsSet, '#N 禁用#!', '#G 启用#!')]\n• 评估模式：[Select_CString(ROOT.Var('auto_court_aptitude_mode').IsSet, '#italic 受管理者能力影响#!', '#high 严格按规则执行#!')]"

 # 通用文本
 auto_court_event.common.back:0 "« 返回上级菜单"
